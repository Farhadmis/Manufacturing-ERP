<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Mainetti · Admin Console</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--navy:#0f2a5a;--navy2:#16377a;--red:#a61935;--bg:#eef3fb;--line:#dbe4f2;--mute:#6d7c99;--ok:#1f9d55}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,"Segoe UI",sans-serif;background:var(--bg);color:#0c2250;font-size:14px}
button,input,select{font:inherit}h1,h2,h3{margin:0}
.btn{border:0;border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer;background:var(--navy);color:#fff}
.btn.red{background:var(--red)}.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}.btn.del{background:#fff;color:var(--red);border:1px solid #f0c4cc}
input,select{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;color:inherit;width:100%}
label{display:block;font-size:12px;font-weight:600;color:var(--mute);margin:10px 0 4px}
#login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,var(--navy),#1d4a9c)}
.lbox{width:380px;max-width:92vw;background:#fff;border-radius:22px;padding:34px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.lbox h1{font-size:22px;margin-bottom:4px}.lbox p{color:var(--mute);margin:0 0 14px}.err{color:#b3261e;font-size:13px;min-height:18px;margin-top:8px}
#app{display:none;min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:236px;background:var(--navy);color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:4px}
.brand{font-weight:800;font-size:17px;padding:0 10px 4px}.brand small{display:block;font-weight:500;font-size:11px;opacity:.65}
.nav{padding:11px 14px;border-radius:10px;cursor:pointer;opacity:.82;font-weight:500}.nav:hover{background:rgba(255,255,255,.08)}.nav.on{background:#fff;color:var(--navy);opacity:1;font-weight:700}
.side .sp{flex:1}.main{margin-left:236px;padding:26px 30px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px;flex-wrap:wrap}.top h2{font-size:24px}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 6px 20px rgba(16,44,92,.07);margin-bottom:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.kpi{background:#fff;border-radius:16px;padding:18px;box-shadow:0 6px 20px rgba(16,44,92,.07);border-top:4px solid var(--red)}
.kpi b{font-size:30px;display:block}.kpi span{color:var(--mute);font-size:12px}
table{width:100%;border-collapse:collapse}th{background:#f4f8ff;text-align:left;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}.scroll{overflow:auto;max-height:60vh}
.tag{padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;background:#e3ecfb;color:var(--navy)}.tag.on{background:#dcf5e6;color:var(--ok)}.tag.off{background:#fde4e8;color:var(--red)}
.mrow{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}.mh{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#f7faff;font-weight:700}
.mh .g{flex:1}.sub{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 34px;border-top:1px solid var(--line)}.sub .g{flex:1}
.add{display:flex;gap:8px;padding:8px 14px 10px 34px;border-top:1px dashed var(--line)}.add input{padding:6px 10px}
.split{display:grid;grid-template-columns:260px 1fr;gap:18px}.tree .n{padding:8px 10px;border-radius:8px;cursor:pointer}.tree .n.s{padding-left:26px;font-size:13px}.tree .n:hover{background:#eef3fb}.tree .n.on{background:var(--navy);color:#fff}
#ov{position:fixed;inset:0;background:rgba(10,25,60,.55);display:none;place-items:center;z-index:9;padding:16px}.mod{background:#fff;border-radius:18px;padding:24px;width:640px;max-width:100%;max-height:92vh;overflow:auto}
.mod h3{margin-bottom:6px;font-size:18px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.pm td,.pm th{padding:6px 10px;text-align:center}.pm td:first-child,.pm th:first-child{text-align:left}.pm .s td:first-child{padding-left:28px;color:var(--mute)}input[type=checkbox]{width:auto;accent-color:var(--navy);transform:scale(1.15)}
.empty{color:var(--mute);text-align:center;padding:30px}.toast{position:fixed;bottom:22px;right:22px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;display:none;z-index:20}
@media(max-width:860px){.side{position:static;width:auto;flex-direction:row;flex-wrap:wrap}.main{margin:0;padding:16px}.split{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.brand,.sp{display:none}}
</style></head><body>
<div id="login"><form class="lbox" id="lf"><h1>Admin Console</h1><p>Mainetti Bangladesh · Hanger Manufacturing ERP</p>
<label>Admin ID</label><input id="lu" autocomplete="username"><label>Password</label><input id="lp" type="password" autocomplete="current-password">
<div class="err" id="le"></div><button class="btn red" style="width:100%;margin-top:10px;padding:12px">Sign in</button><p style="font-size:12px;margin-top:14px">First login: <b>admin</b> / <b>admin123</b> — change it from Users.</p></form></div>
<div id="app"><aside class="side"><div class="brand">Mainetti Admin<small>Control Center</small></div><div id="nav"></div><div class="sp"></div>
<div class="nav" onclick="logout()">Sign out</div></aside><main class="main" id="main"></main></div>
<div id="ov"><div class="mod" id="mod"></div></div><div class="toast" id="toast"></div>
<script>
const K="mainetti_admin_v1",$=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const M0=["Order","RMS – Raw Material Store","Mixer Room","Production & Planning","Technical","Quality","FG – Finish Good","Delivery","HR – Human Resource","Learning & Development","Document Manager","Report & Analysis","Settings"];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sha=async t=>{try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return"x"+btoa(unescape(encodeURIComponent(t)))}};
let S,me=null,view="dash",sel=null;
const save=()=>localStorage.setItem(K,JSON.stringify(S));
const toast=m=>{const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t._t);t._t=setTimeout(()=>t.style.display="none",2400)};
async function boot(){try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
 if(!S){S={mods:M0.map(n=>({id:uid(),name:n,subs:[]})),users:[{id:"admin",name:"System Admin",role:"admin",active:true,pw:await sha("admin123"),perm:{}}],data:{}};save()}
 try{const s=sessionStorage.getItem("adm");if(s){me=S.users.find(u=>u.id===s&&u.role==="admin"&&u.active);if(me)enter()}}catch(e){}}
$("#lf").onsubmit=async e=>{e.preventDefault();const u=S.users.find(x=>x.id.toLowerCase()===$("#lu").value.trim().toLowerCase());
 if(!u||u.pw!==await sha($("#lp").value)||!u.active||u.role!=="admin"){$("#le").textContent="Wrong ID/password, or no admin access.";return}
 me=u;sessionStorage.setItem("adm",u.id);$("#lp").value="";enter()};
function enter(){$("#login").style.display="none";$("#app").style.display="block";go("dash")}
function logout(){sessionStorage.removeItem("adm");location.reload()}
function go(v){view=v;$("#nav").innerHTML=[["dash","Dashboard"],["users","Users & Access"],["mods","Modules"],["data","Data Manager"],["bk","Backup"]].map(([k,n])=>`<div class="nav ${k===v?"on":""}" onclick="go('${k}')">${n}</div>`).join("");
 ({dash,users,mods,data,bk})[v]()}
const nodes=()=>S.mods.flatMap(m=>[{id:m.id,name:m.name,mod:m},...m.subs.map(s=>({id:s.id,name:s.name,sub:true,mod:m}))]);
const open=h=>{$("#mod").innerHTML=h;$("#ov").style.display="grid"},shut=()=>$("#ov").style.display="none";
$("#ov").onclick=e=>{if(e.target.id==="ov")shut()};
function dash(){const subs=S.mods.reduce((a,m)=>a+m.subs.length,0),sets=Object.keys(S.data).length,rows=Object.values(S.data).reduce((a,d)=>a+d.rows.length,0);
 $("#main").innerHTML=`<div class="top"><h2>Dashboard</h2><span class="tag">Signed in: ${esc(me.name)}</span></div><div class="kpis">
 ${[["Modules",S.mods.length],["Sub-modules",subs],["Users",S.users.length],["Datasets",sets],["Data rows",rows]].map(k=>`<div class="kpi"><b>${k[1]}</b><span>${k[0]}</span></div>`).join("")}</div>
 <div class="card" style="margin-top:18px"><h3 style="margin-bottom:10px">Module overview</h3><table><tr><th>Module</th><th>Sub-modules</th><th>Rows</th></tr>${S.mods.map(m=>`<tr><td>${esc(m.name)}</td><td>${m.subs.length}</td><td>${[m,...m.subs].reduce((a,n)=>a+(S.data[n.id]?.rows.length||0),0)}</td></tr>`).join("")}</table></div>`}
/* ---------- USERS ---------- */
function users(){$("#main").innerHTML=`<div class="top"><h2>Users & Access</h2><button class="btn red" onclick="uForm()">+ Create user</button></div><div class="card scroll"><table><tr><th>Login ID</th><th>Name</th><th>Role</th><th>Status</th><th>Access</th><th></th></tr>
 ${S.users.map(u=>`<tr><td><b>${esc(u.id)}</b></td><td>${esc(u.name)}</td><td><span class="tag">${u.role}</span></td><td><span class="tag ${u.active?"on":"off"}">${u.active?"Active":"Disabled"}</span></td>
 <td>${u.role==="admin"?"Full access":Object.values(u.perm).filter(p=>p.v).length+" modules"}</td><td style="white-space:nowrap">${u.role==="admin"?"":`<button class="btn sm ghost" onclick="pForm('${u.id}')">Permissions</button> `}<button class="btn sm ghost" onclick="uForm('${u.id}')">Edit</button> ${u.id===me.id?"":`<button class="btn sm del" onclick="uDel('${u.id}')">Delete</button>`}</td></tr>`).join("")}</table></div>`}
function uForm(id){const u=S.users.find(x=>x.id===id)||{id:"",name:"",role:"user",active:true,perm:{}};
 open(`<h3>${id?"Edit":"Create"} user</h3><div class="grid2"><div><label>Login ID</label><input id="f1" value="${esc(u.id)}" ${id?"disabled":""}></div><div><label>Full name</label><input id="f2" value="${esc(u.name)}"></div>
 <div><label>Password ${id?"(leave blank to keep)":""}</label><input id="f3" type="password" autocomplete="new-password"></div><div><label>Role</label><select id="f4" onchange="$('#pw').style.display=this.value==='admin'?'none':''"><option value="user" ${u.role==="user"?"selected":""}>User (module access)</option><option value="admin" ${u.role==="admin"?"selected":""}>Admin (full access)</option></select></div>
 <div><label>Status</label><select id="f5"><option value="1" ${u.active?"selected":""}>Active</option><option value="0" ${u.active?"":"selected"}>Disabled</option></select></div></div><div id="pw" style="${u.role==="admin"?"display:none":""}"><label style="margin-top:18px">Module access — V view · A add · E edit · D delete</label><div class="scroll" style="max-height:36vh;border:1px solid var(--line);border-radius:12px">${permTable(u)}</div></div><div class="err" id="fe"></div>
 <div class="acts"><button class="btn ghost" onclick="shut()">Cancel</button><button class="btn red" onclick="uSave('${id||""}')">Save</button></div>`)}
async function uSave(id){const v=n=>$("#"+n).value.trim(),e=m=>$("#fe").textContent=m;let u=S.users.find(x=>x.id===id);
 if(!id){const i=v("f1");if(!/^[A-Za-z0-9._-]{3,}$/.test(i))return e("ID: min 3 chars, letters/numbers . _ - only.");if(S.users.some(x=>x.id.toLowerCase()===i.toLowerCase()))return e("This ID already exists.");if(v("f3").length<6)return e("Password: min 6 characters.");u={id:i,perm:{}};S.users.push(u)}
 else if(v("f3")&&v("f3").length<6)return e("Password: min 6 characters.");
 if(u.id===me.id&&(v("f4")!=="admin"||v("f5")!=="1"))return e("You cannot demote or disable yourself.");
 u.name=v("f2")||u.id;u.role=v("f4");u.active=v("f5")==="1";if(v("f3"))u.pw=await sha($("#f3").value);u.perm=u.role==="admin"?{}:collectPerm();save();shut();users();toast("User saved")}
function uDel(id){if(confirm("Delete user "+id+"?")){S.users=S.users.filter(u=>u.id!==id);save();users();toast("User deleted")}}
function permTable(u){const P=(n,k)=>u.perm?.[n]?.[k]?"checked":"";
 return `<table class="pm"><tr><th>Module / Sub-module</th>${["v","a","e","d"].map(k=>`<th>${k.toUpperCase()}<br><input type="checkbox" onchange="ha('${k}',this)"></th>`).join("")}</tr>
 ${nodes().map(n=>`<tr class="${n.sub?"s":""}"><td>${esc(n.name)}</td>${["v","a","e","d"].map(k=>`<td><input type="checkbox" class="p-${k}" data-n="${n.id}" data-k="${k}" ${P(n.id,k)} onchange="pc(this)"></td>`).join("")}</tr>`).join("")}</table>`}
function pc(c){const r=c.closest("tr");if(c.dataset.k==="v"){if(!c.checked)r.querySelectorAll("input").forEach(x=>x.checked=false)}else if(c.checked)r.querySelector("[data-k=v]").checked=true}
function ha(k,el){document.querySelectorAll(".p-"+k).forEach(c=>c.checked=el.checked);if(k==="v"&&!el.checked)document.querySelectorAll(".pm input").forEach(c=>c.checked=false);else if(el.checked)document.querySelectorAll(".p-v").forEach(c=>c.checked=true)}
function collectPerm(){const o={};document.querySelectorAll(".pm input[data-n]").forEach(c=>{if(c.checked)(o[c.dataset.n]??={})[c.dataset.k]=1});return o}
function pForm(id){const u=S.users.find(x=>x.id===id);
 open(`<h3>Permissions · ${esc(u.name)}</h3><p style="color:var(--mute);margin:0 0 8px">V = view · A = add · E = edit · D = delete</p><div class="scroll">${permTable(u)}</div>
 <div class="acts"><button class="btn ghost" onclick="shut()">Cancel</button><button class="btn red" onclick="pSave('${id}')">Save access</button></div>`)}
function pSave(id){S.users.find(x=>x.id===id).perm=collectPerm();save();shut();users();toast("Access saved")}
/* ---------- MODULES ---------- */
function mods(){$("#main").innerHTML=`<div class="top"><h2>Modules</h2><div style="display:flex;gap:8px"><input id="nm" placeholder="New module name" style="width:230px"><button class="btn red" onclick="mAdd()">+ Add module</button></div></div>
 ${S.mods.map(m=>`<div class="mrow"><div class="mh"><span class="g">${esc(m.name)} <span class="tag">${m.subs.length} sub</span></span><button class="btn sm ghost" onclick="mRen('${m.id}')">Rename</button><button class="btn sm del" onclick="mDel('${m.id}')">Delete</button></div>
 ${m.subs.map(s=>`<div class="sub"><span class="g">↳ ${esc(s.name)}</span><button class="btn sm ghost" onclick="mRen('${m.id}','${s.id}')">Rename</button><button class="btn sm del" onclick="mDel('${m.id}','${s.id}')">Delete</button></div>`).join("")}
 <div class="add"><input id="s-${m.id}" placeholder="Add sub-module to ${esc(m.name)}"><button class="btn sm" onclick="sAdd('${m.id}')">+ Add</button></div></div>`).join("")}`}
function mAdd(){const n=$("#nm").value.trim();if(!n)return;S.mods.push({id:uid(),name:n,subs:[]});save();mods();toast("Module added")}
function sAdd(mid){const n=$("#s-"+mid).value.trim();if(!n)return;S.mods.find(m=>m.id===mid).subs.push({id:uid(),name:n});save();mods();toast("Sub-module added")}
function mRen(mid,sid){const m=S.mods.find(x=>x.id===mid),t=sid?m.subs.find(s=>s.id===sid):m,n=prompt("New name",t.name);if(n&&n.trim()){t.name=n.trim();save();mods()}}
function purge(ids){ids.forEach(i=>{delete S.data[i];S.users.forEach(u=>delete u.perm[i])})}
function mDel(mid,sid){const m=S.mods.find(x=>x.id===mid);if(!confirm(sid?"Delete this sub-module and its data?":"Delete module, ALL its sub-modules and data?"))return;
 if(sid){m.subs=m.subs.filter(s=>s.id!==sid);purge([sid])}else{purge([m.id,...m.subs.map(s=>s.id)]);S.mods=S.mods.filter(x=>x.id!==mid)}save();sel=null;mods();toast("Deleted")}
/* ---------- DATA ---------- */
function data(){const ns=nodes();if(!sel||!ns.some(n=>n.id===sel))sel=ns[0]?.id;const n=ns.find(x=>x.id===sel),d=n&&S.data[n.id];
 $("#main").innerHTML=`<div class="top"><h2>Data Manager</h2></div><div class="split"><div class="card tree" style="padding:10px;align-self:start">${ns.map(x=>`<div class="n ${x.sub?"s":""} ${x.id===sel?"on":""}" onclick="sel='${x.id}';data()">${x.sub?"↳ ":""}${esc(x.name)}${S.data[x.id]?" ●":""}</div>`).join("")}</div>
 <div class="card">${n?`<div class="top" style="margin-bottom:12px"><h3>${esc(n.name)} ${d?`<span class="tag">${d.rows.length} rows</span>`:""}</h3><div style="display:flex;gap:8px;flex-wrap:wrap">
 <label class="btn red" style="margin:0;color:#fff;font-size:14px;cursor:pointer">⬆ Upload CSV / Excel<input type="file" accept=".csv,.xlsx,.xls" hidden onchange="upl(this)"></label>
 ${d?`<button class="btn ghost" onclick="rAdd()">+ Row</button><button class="btn ghost" onclick="dl()">Download CSV</button><button class="btn del" onclick="dClr()">Delete data</button>`:""}</div></div>
 ${d?`<div class="scroll"><table><tr>${d.cols.map(c=>`<th>${esc(c)}</th>`).join("")}<th></th></tr>${d.rows.map((r,i)=>`<tr>${d.cols.map((c,j)=>`<td>${esc(r[j])}</td>`).join("")}<td style="white-space:nowrap"><button class="btn sm ghost" onclick="rEdit(${i})">Edit</button> <button class="btn sm del" onclick="rDel(${i})">✕</button></td></tr>`).join("")}</table></div>`:`<div class="empty">No data yet. Upload a CSV or Excel file — the first row becomes the column headers.</div>`}`:`<div class="empty">Add a module first.</div>`}</div></div>`}
function csv(t){const R=[];let r=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==","){r.push(c);c=""}else if(ch=="\n"||ch=="\r"){if(ch=="\r"&&t[i+1]=="\n")i++;r.push(c);c="";R.push(r);r=[]}else c+=ch}
 if(c||r.length){r.push(c);R.push(r)}return R.filter(x=>x.some(v=>String(v).trim()!==""))}
async function upl(inp){const f=inp.files[0];if(!f)return;let R;try{if(/\.csv$/i.test(f.name))R=csv((await f.text()).replace(/^\uFEFF/,""));else{if(!window.XLSX)throw 0;const w=XLSX.read(await f.arrayBuffer());R=XLSX.utils.sheet_to_json(w.Sheets[w.SheetNames[0]],{header:1,raw:false,defval:""})}}catch(e){return alert("Could not read this file.")}
 if(R.length<2)return alert("File needs a header row and at least one data row.");const cols=R[0].map((c,i)=>String(c||"Column "+(i+1)).trim()),rows=R.slice(1).map(r=>cols.map((_,i)=>r[i]??""));
 if(S.data[sel]&&!confirm("Replace existing data? (OK = replace, Cancel = append)")){if(S.data[sel].cols.join()!==cols.join())return alert("Columns differ — cannot append.");S.data[sel].rows.push(...rows)}else S.data[sel]={cols,rows};
 try{save()}catch(e){return alert("Browser storage is full. Use a smaller file.")}data();toast(rows.length+" rows uploaded")}
function rForm(i){const d=S.data[sel],r=i==null?[]:d.rows[i];open(`<h3>${i==null?"Add":"Edit"} row</h3><div class="grid2">${d.cols.map((c,j)=>`<div><label>${esc(c)}</label><input class="rf" value="${esc(r[j]||"")}"></div>`).join("")}</div><div class="acts"><button class="btn ghost" onclick="shut()">Cancel</button><button class="btn red" onclick="rSave(${i==null?"null":i})">Save</button></div>`)}
const rAdd=()=>rForm(null),rEdit=i=>rForm(i);
function rSave(i){const v=[...document.querySelectorAll(".rf")].map(x=>x.value),d=S.data[sel];if(i==null)d.rows.push(v);else d.rows[i]=v;save();shut();data()}
function rDel(i){if(confirm("Delete this row?")){S.data[sel].rows.splice(i,1);save();data()}}
function dClr(){if(confirm("Delete ALL data of this module?")){delete S.data[sel];save();data();toast("Data deleted")}}
function dl(){const d=S.data[sel],q=v=>'"'+String(v).replace(/"/g,'""')+'"',t="\uFEFF"+[d.cols,...d.rows].map(r=>r.map(q).join(",")).join("\r\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/csv"}));a.download="export.csv";a.click()}
/* ---------- BACKUP ---------- */
function bk(){$("#main").innerHTML=`<div class="top"><h2>Backup & Restore</h2></div><div class="card"><p>Everything (users, access, modules, data) is stored in this browser. Export a JSON backup regularly.</p>
 <button class="btn red" onclick="bkx()">⬇ Export backup</button> <label class="btn ghost" style="display:inline-block;margin:0;cursor:pointer">⬆ Import backup<input type="file" accept=".json" hidden onchange="bki(this)"></label></div>`}
function bkx(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="mainetti-admin-backup-"+new Date().toISOString().slice(0,10)+".json";a.click()}
async function bki(i){const f=i.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(!j.mods||!j.users||!j.users.some(u=>u.role==="admin"))throw 0;if(!confirm("Replace ALL current data with this backup?"))return;S=j;save();location.reload()}catch(e){alert("Invalid backup file.")}}
boot();
</script></body></html>
