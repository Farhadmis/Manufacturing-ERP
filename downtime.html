<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Mainetti · Downtime Analysis</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0f2a5a;
            --red: #a61935;
            --mute: #6d7c99;
            --line: #dbe4f2;
            --gold: #e0b24a
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: Inter, system-ui, sans-serif;
            color: var(--navy);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #f1f5fb;
            font-size: 13px
        }

        /* ===== header ===== */
        header {
            flex: none;
            position: relative;
            z-index: 60;
            display: flex;
            align-items: stretch;
            height: clamp(66px, 9vh, 88px);
            background: linear-gradient(90deg, #f8fbff, #e8f0fc);
            box-shadow: 0 4px 18px rgba(16, 44, 92, .12)
        }

        .hl {
            display: flex;
            align-items: center;
            gap: clamp(12px, 1.5vw, 24px);
            padding: 0 clamp(14px, 1.8vw, 30px);
            position: relative;
            z-index: 2;
            flex: none
        }

        .hl img {
            height: clamp(40px, 6.2vh, 58px);
            display: block
        }

        .logo {
            font-weight: 800;
            letter-spacing: .06em;
            font-size: 20px;
            line-height: 1;
            color: var(--navy)
        }

        .logo small {
            display: block;
            font-size: 9px;
            letter-spacing: .2em;
            margin-top: 3px;
            color: #12408f
        }

        .sep {
            width: 1px;
            height: 46px;
            background: #9fb3d3;
            flex: none
        }

        .tag {
            font-style: italic;
            font-weight: 600;
            color: #12408f;
            font-size: clamp(12px, 1.15vw, 18px);
            white-space: nowrap
        }

        .tag i {
            font-style: normal;
            margin: 0 .7em;
            opacity: .55
        }

        .gr {
            font-size: 11.5px;
            color: var(--mute);
            margin-top: 3px;
            white-space: nowrap
        }

        .hp {
            flex: 1;
            min-width: 0;
            position: relative;
            overflow: hidden
        }

        .hp::before {
            content: "";
            position: absolute;
            inset: 0;
            background: url(assets/header-photo.jpg) right center/cover no-repeat;
            -webkit-mask-image: linear-gradient(90deg, transparent, #000 40%);
            mask-image: linear-gradient(90deg, transparent, #000 40%)
        }

        .hr {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: clamp(10px, 1.2vw, 18px);
            padding: 0 clamp(14px, 1.6vw, 26px) 0 clamp(54px, 5vw, 84px);
            color: #fff;
            flex: none
        }

        .hr::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(100deg, #0a2a70, #0b3d94);
            clip-path: polygon(44px 0, 100% 0, 100% 100%, 0 100%);
            z-index: -1
        }

        .hr svg.fy {
            width: clamp(30px, 2.6vw, 42px);
            height: clamp(30px, 2.6vw, 42px);
            flex: none
        }

        .ht b {
            display: block;
            font-size: clamp(15px, 1.5vw, 23px);
            font-weight: 800;
            white-space: nowrap
        }

        .ht span {
            display: block;
            font-size: clamp(9.5px, .8vw, 12px);
            opacity: .92;
            margin-top: 2px;
            white-space: nowrap
        }

        .user {
            position: relative
        }

        .ub {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, .14);
            border: 1px solid rgba(255, 255, 255, .4);
            color: #fff;
            border-radius: 999px;
            padding: 4px 14px 4px 4px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit
        }

        .av {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #fff;
            color: #0b3d94;
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: 12px
        }

        .menu {
            position: absolute;
            right: 0;
            top: 46px;
            background: #fff;
            color: var(--navy);
            border-radius: 12px;
            box-shadow: 0 14px 34px rgba(16, 44, 92, .25);
            min-width: 170px;
            display: none;
            overflow: hidden;
            z-index: 30
        }

        .menu div {
            padding: 12px 16px;
            cursor: pointer;
            font-weight: 600
        }

        .menu div:hover {
            background: #f1f5fc
        }

        /* ===== layout ===== */
        .bk {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 1px solid #9fb3d3;
            background: #fff;
            color: var(--navy);
            font-size: 18px;
            cursor: pointer;
            flex: none
        }

        .lay {
            flex: 1;
            min-height: 0;
            display: flex
        }

        aside {
            flex: none;
            width: 250px;
            background: #fff;
            border-right: 1px solid var(--line);
            padding: 10px 0;
            transition: .2s;
            overflow: hidden
        }

        aside.col {
            width: 62px
        }

        .nv {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 20px;
            cursor: pointer;
            font-weight: 600;
            color: #3a4d73;
            border-left: 3px solid transparent
        }

        .nv span {
            line-height: 1.25
        }

        aside.col .nv span {
            white-space: nowrap
        }

        .nv svg {
            width: 20px;
            height: 20px;
            flex: none;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.9;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .nv:hover {
            background: #f5f8fd
        }

        .nv.on {
            color: var(--red);
            background: #fdeff2;
            border-left-color: var(--red)
        }

        .nv.t {
            color: var(--mute);
            margin-bottom: 6px
        }

        main {
            flex: 1;
            min-width: 0;
            overflow: auto;
            padding: 0 22px 30px
        }

        .ttl {
            font-size: 20px;
            font-weight: 800;
            margin: 18px 0 2px
        }

        .sub {
            color: var(--mute);
            margin: 0 0 14px
        }

        .empty {
            background: #fff;
            border-radius: 16px;
            padding: 60px 20px;
            text-align: center;
            color: var(--mute)
        }

        .empty b {
            display: block;
            color: var(--navy);
            font-size: 17px;
            margin-bottom: 6px
        }

        @media(max-width:900px) {
            body {
                height: 100dvh;
                overflow: hidden
            }

            aside {
                width: 62px
            }

            .nv span {
                display: none
            }

            .hl {
                padding: 8px 12px
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="hl"><button class="bk" onclick="location.href='shopfloor.html'" title="Back">←</button>
            <img src="assets/logo.png" style="cursor:pointer" onclick="location.href='portal.html'"
                alt="Mainetti Bangladesh"
                onerror="this.outerHTML='<div class=&quot;logo&quot;>MAINETTI<small>BANGLADESH PVT. LTD.</small></div>'">
            <div class="sep"></div>
            <div>
                <div class="tag">Drive Efficiency<i>/</i>Ensure Quality<i>/</i>Grow Together</div>
                <div class="gr" id="gr"></div>
            </div>
        </div>
        <div class="hp"></div>
        <div class="hr"><svg class="fy" viewBox="0 0 24 24">
                <path fill="#fff" d="M2 21V10l6 3.6V10l6 3.6V4h3.4v9.6H22V21z" />
                <path fill="rgba(11,61,148,.55)" d="M5 17h2.2v2.2H5zM10 17h2.2v2.2H10zM15 17h2.2v2.2H15z" />
                <path fill="#fff" opacity=".7" d="M16.2 1.5h2.6v2h-2.6z" />
            </svg>
            <div class="ht"><b>Downtime Analysis</b><span>Maintenance performance &amp; analytics</span></div>
            <div class="user"><button class="ub" id="ub"><span class="av" id="av"></span><span id="un"></span>
                    ▾</button>
                <div class="menu" id="mn">
                    <div onclick="location.href='portal.html'">Portal</div>
                    <div onclick="location.href='production.html'">Production &amp; Planning</div>
                    <div id="adm" style="display:none" onclick="location.href='admin.html'">Admin Console</div>
                    <div onclick="out()">Sign out</div>
                </div>
            </div>
        </div>
    </header>
    <div class="lay">
        <div class="lay">
            <aside id="sd">
                <div class="nv t" onclick="document.querySelector('#sd').classList.toggle('col')"><svg
                        viewBox="0 0 24 24">
                        <path d="M4 6h16M4 12h16M4 18h16" />
                    </svg><span>Menu</span></div>
                <div class="nv" onclick="location.href='shopfloor.html#oee'"><svg viewBox="0 0 24 24">
                        <path d="M4 17a8 8 0 1 1 16 0M12 17l4-5M6.5 17h1M16.5 17h1" />
                    </svg><span>OEE Performance Overview</span></div>
                <div class="nv" onclick="location.href='shopfloor.html#prod'"><svg viewBox="0 0 24 24">
                        <path d="M5 20V11M11 20V5M17 20v-6M3 20h18" />
                    </svg><span>Production Performance</span></div>
                <div class="nv on"><svg viewBox="0 0 24 24">
                        <path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v5l3 2" />
                    </svg><span>Downtime Analysis</span></div>
                <div class="nv" onclick="location.href='shopfloor.html#man'"><svg viewBox="0 0 24 24">
                        <path
                            d="M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M17 11a2.5 2.5 0 1 0 0-5M17 14c2.5 0 4 2 4 5" />
                    </svg><span>Manpower Performance</span></div>
                <div class="nv" onclick="location.href='shopfloor.html#mat'"><svg viewBox="0 0 24 24">
                        <path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5M3 17.5l9 5 9-5" />
                    </svg><span>Machine-wise Material Allocation</span></div>
                <div class="nv" onclick="location.href='shopfloor.html#mco'"><svg viewBox="0 0 24 24">
                        <path d="M3 5h18v11H3zM8 20h8M12 16v4" />
                    </svg><span>Machine Overview</span></div>
            </aside>
            <main>
                <style>
                    main {
                        background: linear-gradient(180deg, #e6eefb, #f3f7fe 45%, #eaf1fc);
                        padding: 16px 20px 28px;
                        color: #0f2a5a
                    }

                    .dh {
                        position: relative;
                        overflow: hidden;
                        display: flex;
                        align-items: center;
                        justify-content: space-between;
                        gap: 14px;
                        flex-wrap: wrap;
                        margin-bottom: 12px;
                        padding: 12px 18px;
                        border-radius: 16px;
                        background: linear-gradient(100deg, #0a2a70, #0d47b8 55%, #2f84f5);
                        box-shadow: 0 8px 22px rgba(16, 60, 150, .25)
                    }

                    .dh::after {
                        content: "";
                        position: absolute;
                        right: -40px;
                        top: -50%;
                        width: 380px;
                        height: 200%;
                        background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .16), transparent);
                        transform: skewX(-24deg);
                        pointer-events: none
                    }

                    .dh>* {
                        position: relative;
                        z-index: 1
                    }

                    .dh h1 {
                        margin: 0;
                        font-size: clamp(22px, 2.6vw, 34px);
                        font-weight: 800;
                        color: #fff;
                        letter-spacing: -.3px
                    }

                    .dh p {
                        margin: 2px 0 0;
                        font-size: 13px;
                        font-style: italic;
                        color: #dbe8ff
                    }

                    .lu {
                        border: 1px solid rgba(255, 255, 255, .5);
                        border-radius: 12px;
                        padding: 8px 14px;
                        background: rgba(255, 255, 255, .16);
                        font-size: 12px;
                        color: #dbe8ff
                    }

                    .lu b {
                        display: block;
                        color: #fff;
                        font-size: 13px
                    }

                    .fr {
                        position: relative;
                        z-index: 20;
                        display: flex;
                        gap: 8px;
                        flex-wrap: wrap;
                        align-items: center;
                        background: #fff;
                        border: 1px solid #dbe4f2;
                        border-radius: 14px;
                        padding: 8px 10px;
                        margin-bottom: 12px;
                        box-shadow: 0 3px 12px rgba(16, 44, 92, .07)
                    }

                    .fr>label,
                    .ms>button {
                        display: flex;
                        align-items: center;
                        gap: 6px;
                        height: 38px;
                        font: 600 12px Inter, sans-serif;
                        color: #6d7c99;
                        background: #fff;
                        border: 1px solid #dbe4f2;
                        border-radius: 12px;
                        padding: 0 10px;
                        cursor: pointer;
                        white-space: nowrap
                    }

                    .fr>label:hover,
                    .ms>button:hover,
                    .ms.open>button {
                        border-color: #1f8bff
                    }

                    .fr select {
                        background: transparent;
                        border: 0;
                        color: #0f2a5a;
                        font: 600 13px Inter, sans-serif;
                        padding: 8px 2px;
                        outline: 0;
                        max-width: 110px;
                        cursor: pointer
                    }

                    .fr select option {
                        background: #fff;
                        color: #0f2a5a
                    }

                    .fr input[type=date] {
                        border: 0;
                        outline: 0;
                        background: transparent;
                        font: 600 13px Inter, sans-serif;
                        color: #0f2a5a;
                        padding: 8px 2px;
                        cursor: pointer
                    }

                    .ms {
                        position: relative
                    }

                    .ms>button b {
                        color: #0f2a5a;
                        font-weight: 700;
                        max-width: 110px;
                        overflow: hidden;
                        text-overflow: ellipsis
                    }

                    .ms>button i {
                        font-style: normal;
                        font-size: 10px;
                        color: #6d7c99
                    }

                    .mp {
                        display: none;
                        position: absolute;
                        top: 44px;
                        left: 0;
                        z-index: 80;
                        width: 230px;
                        background: #fff;
                        border: 1px solid #dbe4f2;
                        border-radius: 14px;
                        box-shadow: 0 14px 34px rgba(16, 44, 92, .22);
                        padding: 10px
                    }

                    .ms.open .mp {
                        display: block
                    }

                    .mq {
                        width: 100%;
                        border: 1px solid #dbe4f2;
                        border-radius: 10px;
                        padding: 9px 10px;
                        font: 500 13px Inter, sans-serif;
                        color: #0f2a5a;
                        outline: 0;
                        margin-bottom: 8px
                    }

                    .mq:focus {
                        border-color: #1f8bff
                    }

                    .mo {
                        max-height: 190px;
                        overflow: auto
                    }

                    .mo label {
                        display: flex;
                        align-items: center;
                        gap: 10px;
                        padding: 7px 6px;
                        font: 600 13px Inter, sans-serif;
                        color: #0f2a5a;
                        cursor: pointer;
                        border-radius: 8px
                    }

                    .mo label:hover {
                        background: #f1f5fc
                    }

                    .mo input {
                        width: 16px;
                        height: 16px;
                        accent-color: #0b4fd0;
                        cursor: pointer
                    }

                    .ma {
                        display: flex;
                        gap: 8px;
                        margin-top: 8px
                    }

                    .ma button {
                        flex: 1;
                        border: 1px solid #dbe4f2;
                        background: #fff;
                        border-radius: 10px;
                        padding: 8px;
                        font: 700 13px Inter, sans-serif;
                        color: #0f2a5a;
                        cursor: pointer
                    }

                    .ma button:hover {
                        background: #f1f5fc
                    }

                    .rf {
                        margin-left: auto;
                        height: 38px;
                        background: linear-gradient(135deg, #1f8bff, #0b4fd0);
                        color: #fff;
                        border: 0;
                        border-radius: 12px;
                        padding: 0 20px;
                        font: 700 13px Inter, sans-serif;
                        cursor: pointer;
                        box-shadow: 0 4px 10px rgba(11, 79, 208, .3)
                    }

                    .rf:hover {
                        filter: brightness(1.1)
                    }

                    .kg {
                        display: grid;
                        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
                        gap: 10px;
                        margin-bottom: 12px
                    }

                    .kp {
                        border-radius: 14px;
                        padding: 11px 13px;
                        border: 1px solid rgba(255, 255, 255, .4);
                        min-height: 104px;
                        position: relative;
                        overflow: hidden;
                        box-shadow: 0 6px 16px rgba(16, 44, 92, .18)
                    }

                    .kp .t {
                        font-size: 13px;
                        font-weight: 700;
                        color: #fff;
                        line-height: 1.2
                    }

                    .kp .t small {
                        display: block;
                        font-size: 10px;
                        font-weight: 500;
                        opacity: .9
                    }

                    .kp .v {
                        font-size: 27px;
                        font-weight: 800;
                        color: #fff;
                        margin-top: 6px;
                        display: flex;
                        align-items: baseline;
                        gap: 6px;
                        flex-wrap: wrap
                    }

                    .kp .v i {
                        font-style: normal;
                        font-size: 13px;
                        font-weight: 600;
                        opacity: .95
                    }

                    .kp .v em {
                        font-style: normal;
                        font-size: 11.5px;
                        font-weight: 700;
                        background: rgba(255, 255, 255, .22);
                        border-radius: 99px;
                        padding: 1px 7px
                    }

                    .good {
                        color: #c4ffd8
                    }

                    .bad {
                        color: #ffd3d3
                    }

                    .kp .s {
                        font-size: 10.5px;
                        color: #fff;
                        opacity: .92;
                        margin-top: 3px
                    }

                    .k1 {
                        background: linear-gradient(135deg, #1f7bf2, #0b43b4)
                    }

                    .k2 {
                        background: linear-gradient(135deg, #24c45e, #0e8a3e)
                    }

                    .k3 {
                        background: linear-gradient(135deg, #ffa328, #e0700c)
                    }

                    .k4 {
                        background: linear-gradient(135deg, #9a4cf0, #5a2bc0)
                    }

                    .k5 {
                        background: linear-gradient(135deg, #17bdf2, #0a86c6)
                    }

                    .k6 {
                        background: linear-gradient(135deg, #ff5757, #c4262e)
                    }

                    .k7 {
                        background: linear-gradient(135deg, #2fcb62, #0f8f3f)
                    }

                    .k8 {
                        background: linear-gradient(135deg, #6f55ee, #3a2aa8)
                    }

                    .pg {
                        display: grid;
                        gap: 12px;
                        margin-bottom: 12px
                    }

                    .g2 {
                        grid-template-columns: 1.15fr 1fr
                    }

                    .g3 {
                        grid-template-columns: 1fr 1.2fr 1.1fr
                    }

                    @media(max-width:1100px) {

                        .g2,
                        .g3 {
                            grid-template-columns: 1fr
                        }
                    }

                    .pn {
                        background: #fff;
                        border: 1px solid #dbe4f2;
                        border-radius: 16px;
                        padding: 0 14px 12px;
                        min-width: 0;
                        overflow: hidden;
                        box-shadow: 0 4px 14px rgba(16, 44, 92, .07)
                    }

                    .pn h3 {
                        margin: 0 -14px 8px;
                        padding: 7px 14px;
                        font-size: 17px;
                        font-weight: 800;
                        color: #0f2a5a;
                        background: linear-gradient(90deg, #bcd3f6, #eef4ff 65%, #fff)
                    }

                    .lg2 {
                        display: flex;
                        gap: 14px;
                        flex-wrap: wrap;
                        font-size: 11.5px;
                        font-weight: 600;
                        color: #3a4d73;
                        margin-bottom: 2px
                    }

                    .lg2 i {
                        display: inline-block;
                        width: 10px;
                        height: 10px;
                        border-radius: 50%;
                        margin-right: 5px
                    }

                    .pn svg {
                        width: 100%;
                        height: auto;
                        display: block
                    }

                    .pn text {
                        font-family: Inter, sans-serif
                    }

                    .nd2 {
                        padding: 40px 10px;
                        text-align: center;
                        color: #5b6b8c;
                        font-size: 13px
                    }

                    .fm {
                        margin-top: 8px;
                        font-size: 12px;
                        color: #5b6b8c
                    }

                    .fm summary {
                        cursor: pointer;
                        color: #0b4fd0;
                        font-weight: 600
                    }

                    .fm div {
                        margin-top: 6px;
                        line-height: 1.7
                    }

                    #tt {
                        position: fixed;
                        z-index: 999;
                        pointer-events: none;
                        background: #031445;
                        border: 1px solid #35b4f0;
                        color: #fff;
                        font-size: 12px;
                        padding: 7px 10px;
                        border-radius: 8px;
                        display: none;
                        line-height: 1.5;
                        box-shadow: 0 6px 18px #0008
                    }

                    .sk {
                        animation: pl 1.1s infinite alternate
                    }

                    @keyframes pl {
                        to {
                            opacity: .5
                        }
                    }

                    .mb {
                        display: inline-block;
                        margin-left: 8px;
                        font-size: 10px;
                        font-weight: 700;
                        padding: 2px 8px;
                        border-radius: 99px;
                        background: #a61935;
                        color: #fff;
                        vertical-align: middle;
                        border: 1px solid rgba(255, 255, 255, .5)
                    }
                </style>
                <style>
                    .hm {
                        background: #fff;
                        border: 1px solid #dbe4f2;
                        border-radius: 16px;
                        margin-bottom: 12px;
                        box-shadow: 0 4px 14px rgba(16, 44, 92, .07);
                        overflow: hidden
                    }

                    .hm-h {
                        display: flex;
                        align-items: center;
                        justify-content: space-between;
                        gap: 12px;
                        flex-wrap: wrap;
                        padding: 10px 16px;
                        background: linear-gradient(100deg, #0a2a70, #0d47b8 60%, #1f6fe0);
                        color: #fff
                    }

                    .hm-t {
                        display: flex;
                        align-items: center;
                        gap: 12px
                    }

                    .hm-t>svg {
                        width: 38px;
                        height: 38px;
                        flex: none
                    }

                    .hm-t h2 {
                        margin: 0;
                        font-size: clamp(17px, 2vw, 26px);
                        font-weight: 800;
                        letter-spacing: -.2px
                    }

                    .hm-t h2 b {
                        color: #ffd814
                    }

                    .hm-t small {
                        display: block;
                        font-size: 11.5px;
                        font-weight: 500;
                        color: #cfe0ff;
                        margin-top: 2px
                    }

                    .hm-p {
                        display: flex;
                        gap: 8px;
                        flex-wrap: wrap
                    }

                    .hm-sel {
