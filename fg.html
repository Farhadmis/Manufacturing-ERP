<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Mainetti · Finish Good</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="erp.js"></script>
  <style>
    :root {
      --navy: #0f2a5a;
      --red: #a61935;
      --blue: #2b5bb8;
      --mute: #6d7c99;
      --line: #dbe4f2;
      --bg: #f1f5fb
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--navy);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-size: 13px
    }

    header {
      flex: none;
      height: 64px;
      background: linear-gradient(100deg, #5c0716, #8d0b20 45%, #b3122f);
      color: #fff;
      padding: 0 22px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 6px 20px rgba(100, 10, 30, .25);
      z-index: 6
    }

    .bk {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, .4);
      background: rgba(255, 255, 255, .12);
      color: #fff;
      font-size: 18px;
      cursor: pointer
    }

    .logo {
      font-weight: 800;
      letter-spacing: .06em;
      font-size: 16px;
      line-height: 1
    }

    .logo small {
      display: block;
      font-size: 8px;
      font-weight: 600;
      letter-spacing: .2em;
      opacity: .8;
      margin-top: 3px
    }

    .sep {
      width: 1px;
      height: 30px;
      background: rgba(255, 255, 255, .35)
    }

    .ttl {
      flex: 1
    }

    .ttl b {
      font-size: 18px;
      display: block
    }

    .ttl span {
      font-size: 12px;
      opacity: .85
    }

    .user {
      position: relative
    }

    .ub {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, .14);
      border: 1px solid rgba(255, 255, 255, .4);
      color: #fff;
      border-radius: 999px;
      padding: 5px 14px 5px 5px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px
    }

    .av {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #fff;
      color: var(--red);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 11px
    }

    .menu {
      position: absolute;
      right: 0;
      top: 44px;
      background: #fff;
      color: var(--navy);
      border-radius: 12px;
      box-shadow: 0 14px 34px rgba(16, 44, 92, .25);
      min-width: 150px;
      display: none;
      overflow: hidden
    }

    .menu div {
      padding: 11px 16px;
      cursor: pointer;
      font-weight: 600
    }

    .menu div:hover {
      background: #f1f5fc
    }

    .lay {
      flex: 1;
      min-height: 0;
      display: flex
    }

    aside {
      flex: none;
      width: 214px;
      background: #fff;
      border-right: 1px solid var(--line);
      padding: 10px 0;
      transition: .2s;
      overflow: hidden
    }

    aside.col {
      width: 62px
    }

    .nv {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 20px;
      cursor: pointer;
      font-weight: 600;
      color: #3a4d73;
      border-left: 3px solid transparent;
      white-space: nowrap
    }

    .nv svg {
      width: 20px;
      height: 20px;
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .nv:hover {
      background: #f5f8fd
    }

    .nv.on {
      color: var(--red);
      background: #fdeff2;
      border-left-color: var(--red)
    }

    .nv.t {
      color: var(--mute);
      margin-bottom: 6px
    }

    main {
      flex: 1;
      min-width: 0;
      overflow: auto;
      padding: 0 22px 30px
    }

    .fb {
      display: flex;
      gap: 8px;
      align-items: center;
      overflow-x: auto;
      padding: 12px 0 10px;
      position: sticky;
      top: 0;
      z-index: 4;
      background: var(--bg)
    }

    .f {
      flex: 1 1 0;
      min-width: 108px;
      position: relative
    }

    .f button,
    .f input {
      width: 100%;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--navy);
      font: 600 12px Inter, sans-serif;
      padding: 0 10px;
      text-align: left;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .f button.on {
      border-color: var(--red);
      background: #fdf3f5;
      color: var(--red)
    }

    .f button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px
    }

    .f button:after {
      content: "▾";
      opacity: .6;
      flex: none
    }

    .f.d {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 150px;
      flex: 1.2 1 0
    }

    .f.d span {
      font-weight: 700;
      font-size: 11px;
      color: var(--mute)
    }

    .f.d input {
      padding: 0 6px
    }

    .rs {
      flex: none;
      height: 36px;
      border: 0;
      border-radius: 10px;
      background: var(--navy);
      color: #fff;
      padding: 0 14px;
      font-weight: 700;
      cursor: pointer
    }

    #pn {
      position: fixed;
      z-index: 50;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 14px 34px rgba(16, 44, 92, .22);
      width: 230px;
      display: none
    }

    #pn input[type=text] {
      width: calc(100% - 16px);
      margin: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 10px;
      font: 12px Inter
    }

    #pn .ls {
      max-height: 240px;
      overflow: auto
    }

    #pn label {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 12px
    }

    #pn label:hover {
      background: #f3f7fd
    }

    #pn .ac {
      display: flex;
      gap: 8px;
      padding: 8px;
      border-top: 1px solid var(--line)
    }

    #pn .ac button {
      flex: 1;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: 6px;
      font-weight: 600;
      cursor: pointer;
      color: var(--navy)
    }

    .kp {
      display: flex;
      gap: 12px;
      margin: 6px 0 14px
    }

    .k {
      flex: 1;
      background: #fff;
      border-radius: 14px;
      padding: 13px 16px;
      border-top: 3px solid var(--red);
      box-shadow: 0 5px 16px rgba(16, 44, 92, .07);
      min-width: 0
    }

    .k.b {
      border-top-color: var(--blue)
    }

    .k.o {
      flex: 1.5;
      border-top-color: #e08a00
    }

    .k small {
      color: var(--mute);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .05em
    }

    .k b {
      display: block;
      font-size: 21px;
      margin-top: 4px;
      white-space: nowrap
    }

    .k .oo {
      display: flex;
      gap: 16px;
      margin-top: 4px
    }

    .k .oo div {
      flex: 1
    }

    .k .oo b {
      font-size: 15px;
      margin: 0
    }

    .k .oo i {
      font-style: normal;
      font-size: 11px;
      color: var(--mute);
      display: block
    }

    .cg {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px
    }

    .c {
      background: #fff;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 5px 16px rgba(16, 44, 92, .07);
      min-width: 0
    }

    .c.w {
      grid-column: 1/-1
    }

    .c h4 {
      margin: 0 0 10px;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px
    }

    .cv {
      position: relative;
      height: 270px
    }

    .c select {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 5px 8px;
      font: 600 12px Inter;
      color: var(--navy)
    }

    .hm {
      overflow: auto
    }

    .hm table {
      border-collapse: separate;
      border-spacing: 3px;
      width: 100%
    }

    .hm th {
      font-size: 11px;
      color: var(--mute);
      padding: 6px;
      text-align: center
    }

    .hm td {
      padding: 10px 6px;
      text-align: center;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      min-width: 62px
    }

    .hm td.y,
    .hm th.y {
      background: none;
      text-align: left;
      font-weight: 800;
      color: var(--navy)
    }

    .hm td.t {
      background: #eef3fb
    }

    .tb {
      overflow: auto;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 5px 16px rgba(16, 44, 92, .07);
      max-height: calc(100vh - 290px)
    }

    .tb table {
      width: 100%;
      border-collapse: collapse
    }

    .tb th {
      position: sticky;
      top: 0;
      background: #f4f8ff;
      color: var(--mute);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .04em;
      text-align: left;
      padding: 11px 12px;
      white-space: nowrap
    }

    .tb td {
      padding: 9px 12px;
      border-bottom: 1px solid #edf2fa;
      white-space: nowrap
    }

    .tb td.r,
    .tb th.r {
      text-align: right
    }

    .tb td:nth-child(2) {
      max-width: 230px;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .tb tr:hover td {
      background: #fafcff
    }

    .tag {
      padding: 2px 9px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 700;
      background: #fff1d6;
      color: #a86400
    }

    .tag.ic {
      background: #dcf0ff;
      color: #1d5fa8
    }

    .pg {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 10px 2px;
      color: var(--mute);
      gap: 10px
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 9px 16px;
      font-weight: 700;
      cursor: pointer;
      background: var(--navy);
      color: #fff;
      font-size: 12px
    }

    .btn.g {
      background: #fff;
      color: var(--navy);
      border: 1px solid var(--line)
    }

    .btn.red {
      background: var(--red)
    }

    .empty {
      background: #fff;
      border-radius: 16px;
      padding: 60px 20px;
      text-align: center;
      color: var(--mute);
      margin-top: 18px
    }

    .empty b {
      display: block;
      color: var(--navy);
      font-size: 17px;
      margin-bottom: 6px
    }

    @media(max-width:900px) {
      .cg {
        grid-template-columns: 1fr
      }

      .kp {
        overflow-x: auto
      }

      .k {
        min-width: 150px
      }

      aside {
        width: 62px
      }

      .nv span {
        display: none
      }

      .ttl span {
        display: none
      }
    }

    .g3 {
      grid-column: 1/-1;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px
    }

    .pv th.yh {
      cursor: pointer;
      text-align: center;
      background: #e9f1fc;
      color: var(--navy);
      user-select: none
    }

    .pv th.r {
      text-align: right
    }

    .pv tr.h2 th {
      top: 37px
    }

    .pv th {
      z-index: 2
    }

    .pv td.s,
    .pv th.s {
      position: sticky;
      left: 0;
      background: #fff;
      z-index: 3;
      min-width: 110px;
      max-width: 110px;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 700
    }

    .pv th.s {
      background: #f4f8ff;
      z-index: 4
    }

    .pv td.db {
      position: relative;
      padding: 0;
      min-width: 92px
    }

    .pv td.db i {
      position: absolute;
      left: 3px;
      top: 4px;
      bottom: 4px;
      max-width: calc(100% - 6px);
      border: 1px solid #63be7b;
      border-radius: 2px;
      background: linear-gradient(90deg, #63be7b, #d5f0dd)
    }

    .pv td.db span {
      position: relative;
      display: block;
      padding: 9px 12px;
      text-align: right
    }

    .pv td em {
      font-style: normal;
      color: #3a4d73;
      font-weight: 600
    }

    .pv th.r {
      min-width: 92px
    }

    @media(max-width:900px) {
      .g3 {
        grid-template-columns: 1fr
      }
    }

    /* ===== Raw Data · premium cards & table (scoped: rk-* / pv2 / rwt only) ===== */
    .rkp {
      display: flex;
      gap: 14px;
      margin: 6px 0 16px
    }

    .rk {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 16px;
      color: #fff;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(10, 40, 100, .22), inset 0 0 0 1px rgba(255, 255, 255, .18)
    }

    .rk:before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(120% 90% at 0% 0%, rgba(255, 255, 255, .22), transparent 55%);
      pointer-events: none
    }

    .rk-t {
      background: linear-gradient(135deg, #0d3b99, #06214f)
    }

    .rk-1 {
      background: linear-gradient(135deg, #2158e0, #0b2f8f)
    }

    .rk-2 {
      background: linear-gradient(135deg, #14b8d4, #0c6f8c)
    }

    .rk-3 {
      background: linear-gradient(135deg, #34c759, #15803d)
    }

    .rk-5 {
      background: linear-gradient(135deg, #8b5cf6, #4c1d95)
    }

    .rk-ic {
      position: relative;
      flex: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, .18);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .35)
    }

    .rk-ic svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: #fff;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .rk-tx {
      position: relative;
      min-width: 0;
      flex: 1
    }

    .rk-tx small {
      display: block;
      font-size: 12px;
      font-weight: 700;
      opacity: .95
    }

    .rk-tx b {
      display: block;
      font-size: 20px;
      font-weight: 800;
      margin: 2px 0 4px;
      white-space: nowrap;
      letter-spacing: -.01em
    }

    .rk-g {
      font-size: 11.5px;
      font-weight: 700;
      white-space: nowrap
    }

    .rk-g.up {
      color: #9bffc0
    }

    .rk-g.dn {
      color: #ffc2c2
    }

    .rk-g.na {
      opacity: .7
    }

    .rk-bars {
      position: absolute;
      right: 12px;
      bottom: 12px;
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 26px
    }

    .rk-bars i {
      display: block;
      width: 5px;
      border-radius: 2px 2px 0 0;
      background: rgba(255, 255, 255, .35)
    }

    .rk-bars i.l {
      background: rgba(255, 255, 255, .85)
    }

    .rwt {
      overflow: auto;
      background: #fff;
      border-radius: 16px;
      border: 1px solid #c9d9f2;
      box-shadow: 0 8px 22px rgba(16, 44, 92, .10);
      max-height: calc(100vh - 300px)
    }

    .pv2 {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 12.5px;
      font-variant-numeric: tabular-nums
    }

    .pv2 th {
      position: sticky;
      z-index: 3;
      color: #fff;
      white-space: nowrap;
      padding: 0 10px;
      text-align: center
    }

    .pv2 thead tr:first-child th {
      top: 0;
      height: 42px
    }

    .pv2 thead tr:nth-child(2) th {
      top: 42px;
      height: 28px
    }

    .pv2 th.mh {
      background: linear-gradient(180deg, #0c3a8f, #052a72);
      font-size: 14px;
      font-weight: 800;
      z-index: 6
    }

    .pv2 th.yh {
      background: linear-gradient(180deg, #154aa8, #0e3d96);
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      user-select: none;
      border-left: 1px solid rgba(255, 255, 255, .22)
    }

    .pv2 th.yh i {
      font-style: normal;
      font-size: 10px;
      opacity: .7;
      margin-left: 6px;
      vertical-align: middle
    }

    .pv2 th.sh {
      background: #0e3d96;
      font-size: 11px;
      font-weight: 600;
      color: #dbe8ff;
      border-top: 1px solid rgba(255, 255, 255, .18)
    }

    .pv2 th.ys {
      border-left: 1px solid rgba(255, 255, 255, .22)
    }

    .pv2 th.c1,
    .pv2 td.c1 {
      left: 0;
      min-width: 96px;
      max-width: 96px
    }

    .pv2 th.c2,
    .pv2 td.c2 {
      left: 96px;
      min-width: 84px;
      max-width: 84px
    }

    .pv2 th.gh {
      right: 0
    }

    .pv2 td {
      height: 34px;
      padding: 0;
      border-bottom: 1px solid #e3ebf7;
      white-space: nowrap
    }

    .pv2 td.c1,
    .pv2 td.c2 {
      position: sticky;
      background: #fff;
      z-index: 2;
      font-weight: 800;
      padding: 0 10px;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .pv2 td.c2 {
      border-right: 1px solid #e3ebf7
    }

    .pv2 td.bc {
      position: relative;
      min-width: 128px
    }

    .pv2 td.bc i {
      position: absolute;
      left: 3px;
      top: 5px;
      bottom: 5px;
      max-width: calc(100% - 6px);
      border-radius: 3px;
      background: linear-gradient(90deg, #3fcf6b 0%, #8fe3a9 55%, rgba(220, 247, 228, .55) 100%)
    }

    .pv2 td.bc span {
      position: relative;
      display: block;
      text-align: center;
      padding: 0 10px;
      font-weight: 600;
      color: #10285a;
      line-height: 34px
    }

    .pv2 td.bc.z span {
      color: #7b89a6
    }

    .pv2 td.bc.gc {
      position: sticky;
      right: 0;
      z-index: 2;
      background: #fff;
      min-width: 150px;
      box-shadow: -6px 0 8px -6px rgba(16, 44, 92, .22)
    }

    .pv2 td.bc.gc span {
      font-weight: 700
    }

    .pv2 td.bc.gc em {
      font-style: normal;
      margin-left: 8px;
      font-weight: 700;
      color: #3a4d73
    }

    .pv2 td.ys {
      border-left: 1px solid #d3e0f4
    }

    .pv2 tbody tr:hover td {
      background-color: #f6faff
    }

    .pv2 tfoot td {
      position: sticky;
      bottom: 0;
      z-index: 3;
      height: 46px;
      padding: 0 10px;
      text-align: center;
      font-weight: 800;
      font-size: 14px;
      color: #fff;
      background: linear-gradient(180deg, #0c3a8f, #052a72);
      border-left: 1px solid rgba(255, 255, 255, .18);
      border-bottom: 0
    }

    .pv2 tfoot td.f1 {
      left: 0;
      z-index: 5;
      text-align: left;
      font-size: 13px;
      min-width: 180px;
      max-width: none
    }

    .pv2 tfoot td.f1 svg {
      width: 18px;
      height: 18px;
      vertical-align: -4px;
      margin-right: 8px;
      fill: none;
      stroke: #fff;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .pv2 tfoot td.gt {
      right: 0;
      z-index: 5;
      background: linear-gradient(180deg, #1a6dff, #0a4fd6);
      font-size: 15px
    }

    @media(max-width:900px) {
      .rkp {
        overflow-x: auto
      }

      .rk {
        min-width: 210px
      }
    }

    /* ===== v2: filter bar সবসময় এক লাইনে (zoom করলেও scroll নেই) ===== */

  <div id="pn"></div>
  <script>
    const $ = s => document.querySelector(s), esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    let ME = null; const out = () => ERP.signOut();
    $("#ub").onclick = e => { e.stopPropagation(); const m = $("#mn"); m.style.display = m.style.display === "block" ? "none" : "block" };
    document.addEventListener("click", e => { $("#mn").style.display = "none"; if (!e.target.closest("#pn,.f")) $("#pn").style.display = "none" });
    const MN = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    const n0 = v => Math.round(v).toLocaleString("en-US");
    const ab = v => Math.abs(v) >= 1e6 ? +(v / 1e6).toFixed(1) + "M" : Math.abs(v) >= 1e3 ? +(v / 1e3).toFixed(0) + "K" : v;
    /* ---------- load & normalise the uploaded sheet ---------- */
    const norm = s => String(s).toLowerCase().replace(/[^a-z0-9]/g, "");
    const clean = s => String(s ?? "").replace(/\s+/g, " ").trim();
    const num = v => { const x = parseFloat(String(v ?? "").replace(/,/g, "")); return isNaN(x) ? 0 : x };
    function pdate(v) {
      if (v == null || v === "") return null;
      if (typeof v === "number" && v > 20000) { const d = new Date(Math.round((v - 25569) * 864e5)); return [d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate()] }
      v = String(v).trim(); let m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return [+m[1], +m[2], +m[3]];
      m = v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/); if (m) { let a = +m[1], b = +m[2], y = +m[3]; if (y < 100) y += 2000; return a > 12 ? [y, b, a] : [y, a, b] }
      const d = new Date(v); return isNaN(d) ? null : [d.getFullYear(), d.getMonth() + 1, d.getDate()]
    }

    const UN = ["Unit-01", "Unit-02", "Unit-03", "Unit-05"];
    const unit = v => { const m = String(v || "").match(/(\d+)/); return m ? "Unit-" + m[1].padStart(2, "0") : clean(v) || "N/A" };
    let R = [], mod = null, msg = "";
    async function load() {
      ME = await ERP.require(); if (!ME) return false;
      const nm = ME.name || ME.login_id; $("#un").textContent = nm; { const h = new Date().getHours(); $("#gr").textContent = `Good ${h < 12 ? "morning" : h < 17 ? "afternoon" : "evening"}, ${String(nm).split(" ")[0]}. Here is your operation at a glance.` } $("#av").textContent = nm.slice(0, 2).toUpperCase();
      const tree = await ERP.tree(); mod = tree.find(m => /finish|\bfg\b/i.test(m.name));
      if (!mod) { msg = "The Finish Good module does not exist in the Admin Console."; return true }
      if (!ERP.can(ME, mod.id) && !mod.subs.some(s => ERP.can(ME, s.id, "v", mod.id))) { msg = "You do not have access to the Finish Good module."; return true }
      ERP.sideBanner([mod.id, ...mod.subs.map(s => s.id)], [[mod.id, "fg"]]);
      const pk = await ERP.packed(mod.id, "fg");
      if (!pk) { msg = "No Finish Good data yet. Open fg-pack.html (admin) and upload the FG Excel."; return true }
      const D = pk.dict, C = pk.c, q = pk.q, N = q.length;
      const up = s => clean(s).toUpperCase();
      const T = {
        date: D.date.map(s => { const d = pdate(s); return d ? { y: d[0], m: d[1], d: d[2], ds: `${d[0]}-${String(d[1]).padStart(2, "0")}-${String(d[2]).padStart(2, "0")}` } : null }),
        unit: D.unit.map(unit), article: D.article.map(clean), model: D.model.map(up), buyer: D.buyer.map(up),
        color: D.color.map(up), shift: D.shift.map(up), prodtype: D.prodtype.map(clean), mctype: D.mctype.map(up),
        process: D.process.map(up), category: D.category.map(clean),
        tp: D.timesofprocess && C.timesofprocess ? D.timesofprocess.map(up) : null
      };
      R = new Array(N); let n = 0;
      for (let i = 0; i < N; i++) {
        const dd = T.date[C.date[i]]; if (!dd) continue;
        R[n++] = { y: dd.y, m: dd.m, d: dd.d, ds: dd.ds, unit: T.unit[C.unit[i]], art: T.article[C.article[i]], model: T.model[C.model[i]], buyer: T.buyer[C.buyer[i]], color: T.color[C.color[i]], shift: T.shift[C.shift[i]], prod: T.prodtype[C.prodtype[i]], mc: T.mctype[C.mctype[i]], proc: T.process[C.process[i]], cat: T.category[C.category[i]], tp: T.tp ? T.tp[C.timesofprocess[i]] : "", q: q[i] }
      }
      R.length = n;
      if (!R.length) msg = "The uploaded sheet has no valid rows (check the DATE column).";
      return true
    }
    /* ---------- filters ---------- */
    const FD = [["y", "Year", r => r.y], ["m", "Month", r => r.m], ["buyer", "Buyer", r => r.buyer], ["model", "Model", r => r.model], ["prod", "Prod. Type", r => r.prod], ["art", "Article", r => r.art], ["unit", "Unit", r => r.unit], ["shift", "Shift", r => r.shift], ["mc", "MC Type", r => r.mc], ["proc", "Process", r => r.proc], ["cat", "Category", r => r.cat]];
    const F = {}; FD.forEach(f => F[f[0]] = new Set()); let from = "", to = "", page = "ov";
    const opts = k => { const f = FD.find(x => x[0] === k), src = k === "model" && F.buyer.size ? R.filter(r => F.buyer.has(r.buyer)) : R, s = [...new Set(src.map(f[2]).filter(v => v !== "" && v != null))]; return s.sort((a, b) => typeof a === "number" ? a - b : String(a).localeCompare(String(b))) };
    function syncModel() { if (!F.buyer.size || !F.model.size) return; const ok = new Set(R.filter(r => F.buyer.has(r.buyer)).map(r => r.model)); F.model = new Set([...F.model].filter(m => ok.has(m))) }
    const lab = (k, v) => k === "m" ? MN[v - 1] : v;
    function fbuild() {
      if (msg) { $("#fb").innerHTML = ""; return }
      const o = FD.slice(0, 1).concat(FD.slice(1, 2));
      const btn = f => `<div class="f"><button data-k="${f[0]}" class="${F[f[0]].size ? "on" : ""}">${f[1]}${F[f[0]].size ? " (" + F[f[0]].size + ")" : ""}</button></div>`;
      $("#fb").innerHTML = btn(FD[0]) + btn(FD[1]) + `<div class="f d"><span>From</span><input type="date" id="df" value="${from}"></div><div class="f d"><span>To</span><input type="date" id="dt" value="${to}"></div>` + FD.slice(2).map(btn).join("") + `<button class="rs" onclick="reset()">Reset</button>`;
      $("#fb").querySelectorAll("button[data-k]").forEach(b => b.onclick = e => { e.stopPropagation(); pnl(b) });
      $("#df").onchange = e => { from = e.target.value; draw() }; $("#dt").onchange = e => { to = e.target.value; draw() }
    }
    function pnl(b) {
      const k = b.dataset.k, p = $("#pn"), r = b.getBoundingClientRect(), L = opts(k);
      p.innerHTML = `<input type="text" placeholder="Search…"><div class="ls">${L.map(v => `<label><input type="checkbox" value="${esc(v)}" ${F[k].has(v) ? "checked" : ""}> ${esc(lab(k, v))}</label>`).join("")}</div><div class="ac"><button data-a="all">Select all</button><button data-a="clr">Clear</button></div>`;
      p.style.left = Math.min(r.left, innerWidth - 240) + "px"; p.style.top = r.bottom + 4 + "px"; p.style.display = "block";
      const upd = () => { fbuild(); draw() };
      p.querySelector("input[type=text]").oninput = e => p.querySelectorAll("label").forEach(l => l.style.display = l.textContent.toLowerCase().includes(e.target.value.toLowerCase()) ? "" : "none");
      p.querySelectorAll(".ls input").forEach(c => c.onchange = () => { const v = typeof L[0] === "number" ? +c.value : c.value; c.checked ? F[k].add(v) : F[k].delete(v); b.textContent = FD.find(x => x[0] === k)[1] + (F[k].size ? " (" + F[k].size + ")" : ""); b.classList.toggle("on", !!F[k].size); if (k === "buyer") { syncModel(); fbuild() } draw() });
      p.querySelectorAll(".ac button").forEach(x => x.onclick = () => { F[k] = new Set(x.dataset.a === "all" ? L : []); pnl(document.querySelector(`button[data-k=${k}]`) || b); b.textContent = FD.find(z => z[0] === k)[1] + (F[k].size ? " (" + F[k].size + ")" : ""); b.classList.toggle("on", !!F[k].size); if (k === "buyer") { syncModel(); fbuild() } draw() })
    }
    function reset() { FD.forEach(f => F[f[0]] = new Set()); from = to = ""; fbuild(); draw() }

    const flt = () => R.filter(r => FD.every(f => !F[f[0]].size || F[f[0]].has(f[2](r))) && (!from || r.ds >= from) && (!to || r.ds <= to));
    const sumq = a => a.reduce((s, r) => s + r.q, 0);
    function grp(a, kf) { const m = new Map(); a.forEach(r => { const k = kf(r); m.set(k, (m.get(k) || 0) + r.q) }); return [...m].map(([k, q]) => ({ k, q })) }
    function show(p) { page = p; document.querySelectorAll(".nv[data-p]").forEach(n => n.classList.toggle("on", n.dataset.p === p)); draw() }
    function draw() {
      const c = $("#pgc"); if (msg) { c.innerHTML = `<div class="empty"><b>Finish Good</b>${esc(msg)}</div>`; return }
      const a = flt(); page === "ov" ? ov(a) : raw(a)
