<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Mainetti · Outstanding</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="erp.js"></script>
  <style>
    :root {
      --navy: #0f2a5a;
      --red: #a61935;
      --blue: #2b5bb8;
      --mute: #6d7c99;
      --line: #dbe4f2;
      --bg: #f1f5fb
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--navy);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-size: 13px
    }

    header {
      flex: none;
      height: 64px;
      background: linear-gradient(100deg, #5c0716, #8d0b20 45%, #b3122f);
      color: #fff;
      padding: 0 22px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 6px 20px rgba(100, 10, 30, .25);
      z-index: 6
    }

    .bk {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, .4);
      background: rgba(255, 255, 255, .12);
      color: #fff;
      font-size: 18px;
      cursor: pointer
    }

    .logo {
      font-weight: 800;
      letter-spacing: .06em;
      font-size: 16px;
      line-height: 1
    }

    .logo small {
      display: block;
      font-size: 8px;
      font-weight: 600;
      letter-spacing: .2em;
      opacity: .8;
      margin-top: 3px
    }

    .sep {
      width: 1px;
      height: 30px;
      background: rgba(255, 255, 255, .35)
    }

    .ttl {
      flex: 1
    }

    .ttl b {
      font-size: 18px;
      display: block
    }

    .ttl span {
      font-size: 12px;
      opacity: .85
    }

    .user {
      position: relative
    }

    .ub {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, .14);
      border: 1px solid rgba(255, 255, 255, .4);
      color: #fff;
      border-radius: 999px;
      padding: 5px 14px 5px 5px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px
    }

    .av {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #fff;
      color: var(--red);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 11px
    }

    .menu {
      position: absolute;
      right: 0;
      top: 44px;
      background: #fff;
      color: var(--navy);
      border-radius: 12px;
      box-shadow: 0 14px 34px rgba(16, 44, 92, .25);
      min-width: 150px;
      display: none;
      overflow: hidden
    }

    .menu div {
      padding: 11px 16px;
      cursor: pointer;
      font-weight: 600
    }

    .menu div:hover {
      background: #f1f5fc
    }

    .lay {
      flex: 1;
      min-height: 0;
      display: flex
    }

    aside {
      flex: none;
      width: 214px;
      background: #fff;
      border-right: 1px solid var(--line);
      padding: 10px 0;
      transition: .2s;
      overflow: hidden
    }

    aside.col {
      width: 62px
    }

    .nv {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 20px;
      cursor: pointer;
      font-weight: 600;
      color: #3a4d73;
      border-left: 3px solid transparent;
      white-space: nowrap
    }

    .nv svg {
      width: 20px;
      height: 20px;
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .nv:hover {
      background: #f5f8fd
    }

    .nv.on {
      color: var(--red);
      background: #fdeff2;
      border-left-color: var(--red)
    }

    .nv.t {
      color: var(--mute);
      margin-bottom: 6px
    }

    main {
      flex: 1;
      min-width: 0;
      overflow: auto;
      padding: 0 22px 30px
    }

    .fb {
      display: flex;
      gap: 8px;
      align-items: center;
      overflow-x: auto;
      padding: 12px 0 10px;
      position: sticky;
      top: 0;
      z-index: 4;
      background: var(--bg)
    }

    .f {
      flex: 1 1 0;
      min-width: 108px;
      position: relative
    }

    .f button,
    .f input {
      width: 100%;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--navy);
      font: 600 12px Inter, sans-serif;
      padding: 0 10px;
      text-align: left;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .f button.on {
      border-color: var(--red);
      background: #fdf3f5;
      color: var(--red)
    }

    .f button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px
    }

    .f button:after {
      content: "▾";
      opacity: .6;
      flex: none
    }

    .f.d {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 150px;
      flex: 1.2 1 0
    }

    .f.d span {
      font-weight: 700;
      font-size: 11px;
      color: var(--mute)
    }

    .f.d input {
      padding: 0 6px
    }

    .rs {
      flex: none;
      height: 36px;
      border: 0;
      border-radius: 10px;
      background: var(--navy);
      color: #fff;
      padding: 0 14px;
      font-weight: 700;
      cursor: pointer
    }

    #pn {
      position: fixed;
      z-index: 50;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 14px 34px rgba(16, 44, 92, .22);
      width: 230px;
      display: none
    }

    #pn input[type=text] {
      width: calc(100% - 16px);
      margin: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 10px;
      font: 12px Inter
    }

    #pn .ls {
      max-height: 240px;
      overflow: auto
    }

    #pn label {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 12px
    }

    #pn label:hover {
      background: #f3f7fd
    }

    #pn .ac {
      display: flex;
      gap: 8px;
      padding: 8px;
      border-top: 1px solid var(--line)
    }

    #pn .ac button {
      flex: 1;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: 6px;
      font-weight: 600;
      cursor: pointer;
      color: var(--navy)
    }

    .kp {
      display: flex;
      gap: 12px;
      margin: 6px 0 14px
    }

    .k {
      flex: 1;
      background: #fff;
      border-radius: 14px;
      padding: 13px 16px;
      border-top: 3px solid var(--red);
      box-shadow: 0 5px 16px rgba(16, 44, 92, .07);
      min-width: 0
    }

    .k.b {
      border-top-color: var(--blue)
    }

    .k.o {
      flex: 1.5;
      border-top-color: #e08a00
    }

    .k small {
      color: var(--mute);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .05em
    }

    .k b {
      display: block;
      font-size: 21px;
      margin-top: 4px;
      white-space: nowrap
    }

    .k .oo {
      display: flex;
      gap: 16px;
      margin-top: 4px
    }

    .k .oo div {
      flex: 1
    }

    .k .oo b {
      font-size: 15px;
      margin: 0
    }

    .k .oo i {
      font-style: normal;
      font-size: 11px;
      color: var(--mute);
      display: block
    }

    .cg {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px
    }

    .c {
      background: #fff;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 5px 16px rgba(16, 44, 92, .07);
      min-width: 0
    }

    .c.w {
      grid-column: 1/-1
    }

    .c h4 {
      margin: 0 0 10px;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px
    }

    .cv {
      position: relative;
      height: 270px
    }

    .c select {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 5px 8px;
      font: 600 12px Inter;
      color: var(--navy)
    }

    .hm {
      overflow: auto
    }

    .hm table {
      border-collapse: separate;
      border-spacing: 3px;
      width: 100%
    }

    .hm th {
      font-size: 11px;
      color: var(--mute);
      padding: 6px;
      text-align: center
    }

    .hm td {
      padding: 10px 6px;
      text-align: center;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      min-width: 62px
    }

    .hm td.y,
    .hm th.y {
      background: none;
      text-align: left;
      font-weight: 800;
      color: var(--navy)
    }

    .hm td.t {
      background: #eef3fb
    }

    .tb {
      overflow: auto;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 5px 16px rgba(16, 44, 92, .07);
      max-height: calc(100vh - 290px)
    }

    .tb table {
      width: 100%;
      border-collapse: collapse
    }

    .tb th {
      position: sticky;
      top: 0;
      background: #f4f8ff;
      color: var(--mute);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .04em;
      text-align: left;
      padding: 11px 12px;
      white-space: nowrap
    }

    .tb td {
      padding: 9px 12px;
      border-bottom: 1px solid #edf2fa;
      white-space: nowrap
    }

    .tb td.r,
    .tb th.r {
      text-align: right
    }

    .tb td:nth-child(2) {
      max-width: 230px;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .tb tr:hover td {
      background: #fafcff
    }

    .tag {
      padding: 2px 9px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 700;
      background: #fff1d6;
      color: #a86400
    }

    .tag.ic {
      background: #dcf0ff;
      color: #1d5fa8
    }

    .pg {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 10px 2px;
      color: var(--mute);
      gap: 10px
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 9px 16px;
      font-weight: 700;
      cursor: pointer;
      background: var(--navy);
      color: #fff;
      font-size: 12px
    }

    .btn.g {
      background: #fff;
      color: var(--navy);
      border: 1px solid var(--line)
    }

    .btn.red {
      background: var(--red)
    }

    .empty {
      background: #fff;
      border-radius: 16px;
      padding: 60px 20px;
      text-align: center;
      color: var(--mute);
      margin-top: 18px
    }

    .empty b {
      display: block;
      color: var(--navy);
      font-size: 17px;
      margin-bottom: 6px
    }

    @media(max-width:900px) {
      .cg {
        grid-template-columns: 1fr
      }

      .kp {
        overflow-x: auto
      }

      .k {
        min-width: 150px
      }

      aside {
        width: 62px
      }

      .nv span {
        display: none
      }

      .ttl span {
        display: none
      }
    }

    /* ===== v3: KPI cards (same as FG) ===== */
    .rkp {
      display: flex;
      gap: 14px;
      margin: 6px 0 16px
    }

    .rk {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 16px;
      color: #fff;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(10, 40, 100, .22), inset 0 0 0 1px rgba(255, 255, 255, .18)
    }

    .rk:before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(120% 90% at 0% 0%, rgba(255, 255, 255, .22), transparent 55%);
      pointer-events: none
    }

    .rk-t {
      background: linear-gradient(135deg, #0d3b99, #06214f)
    }

    .rk-1 {
      background: linear-gradient(135deg, #2158e0, #0b2f8f)
    }

    .rk-2 {
      background: linear-gradient(135deg, #14b8d4, #0c6f8c)
    }

    .rk-3 {
      background: linear-gradient(135deg, #34c759, #15803d)
    }

    .rk-5 {
      background: linear-gradient(135deg, #8b5cf6, #4c1d95)
    }

    .rk-ic {
      position: relative;
      flex: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, .18);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .35)
    }

    .rk-ic svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: #fff;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .rk-tx {
      position: relative;
      min-width: 0;
      flex: 1
    }

    .rk-tx small {
      display: block;
      font-size: 12px;
      font-weight: 700;
      opacity: .95
    }

    .rk-tx b {
      display: block;
      font-size: 20px;
      font-weight: 800;
      margin: 2px 0 4px;
      white-space: nowrap;
      letter-spacing: -.01em
    }

    .rk-g {
      font-size: 11.5px;
      font-weight: 700;
      white-space: nowrap
    }

    .rk-g.up {
      color: #9bffc0
    }

    .rk-g.dn {
      color: #ffc2c2
    }

    .rk-g.na {
      opacity: .7
    }

    .rk-bars {
      position: absolute;
      right: 12px;
      bottom: 12px;
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 26px
    }

    .rk-bars i {
      display: block;
      width: 5px;
      border-radius: 2px 2px 0 0;
      background: rgba(255, 255, 255, .35)
    }

    .rk-bars i.l {
      background: rgba(255, 255, 255, .85)
    }

    /* ===== v3: Raw Data KPI cards — glossy style ===== */
    .rkp {
      gap: clamp(8px, 1vw, 16px) !important
    }

    .rk {
      min-height: 92px;
      padding: 14px clamp(10px, 1.1vw, 18px) !important;
      gap: clamp(8px, .9vw, 14px) !important;
      border-radius: 16px !important;
      box-shadow: 0 10px 24px rgba(10, 40, 100, .25), inset 0 0 0 1.5px rgba(255, 255, 255, .38), inset 0 2px 10px rgba(255, 255, 255, .18) !important
    }

    .rk:before {
      background: radial-gradient(110% 80% at 0% 0%, rgba(255, 255, 255, .30), transparent 55%), linear-gradient(180deg, rgba(255, 255, 255, .10), transparent 40%) !important
    }

    .rk-t {
      background: linear-gradient(135deg, #0b4fd0, #061f5e) !important
    }

    .rk-1 {
      background: linear-gradient(135deg, #2f6bf0, #102c9c) !important
    }

    .rk-2 {
      background: linear-gradient(135deg, #27d3ee, #0a6f8f) !important
    }

    .rk-3 {
      background: linear-gradient(135deg, #46d868, #0f7a36) !important
    }

    .rk-5 {
      background: linear-gradient(135deg, #9a6bff, #45199a) !important
    }

    .rk-ic {
      width: clamp(40px, 3.6vw, 54px) !important;
      height: clamp(40px, 3.6vw, 54px) !important;
      background: radial-gradient(circle at 30% 25%, rgba(255, 255, 255, .38), rgba(255, 255, 255, .12)) !important;
      box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .55), 0 4px 10px rgba(0, 0, 0, .18) !important;
      z-index: 1
    }

    .rk-ic svg {
      width: 56% !important;
      height: 56% !important;
      stroke: none !important;
      fill: #fff !important;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .25))
    }

    .rk-tx {
      z-index: 1
    }

    .rk-tx small {
      font-size: clamp(11px, .9vw, 13px) !important;
      font-weight: 700 !important;
      opacity: 1 !important
    }

    .rk-tx b {
      font-size: clamp(17px, 1.65vw, 24px) !important;
      font-weight: 800 !important;
      margin: 3px 0 6px !important;
      text-shadow: 0 1px 3px rgba(0, 0, 0, .2)
    }

    .rk-g {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: #fff !important;
      font-size: clamp(10.5px, .85vw, 12.5px) !important;
      font-weight: 700 !important;
      opacity: 1 !important
    }

    .rk-g em {
      font-style: normal;
      font-size: 10px;
      line-height: 1
    }

    .rk-g.up em {
      color: #5dff8f
    }

    .rk-g.dn em {
      color: #ff8f8f
    }

    .rk-bars {
      right: 10px !important;
      bottom: 8px !important;
      gap: 3px !important;
      height: 40px !important;
      align-items: flex-end;
      z-index: 0
    }

    .rk-bars i {
      width: 6px !important;
      border-radius: 2px 2px 0 0 !important;
      background: linear-gradient(180deg, rgba(255, 255, 255, .5), rgba(255, 255, 255, .12)) !important
    }

    .rk-bars i.l {
      background: linear-gradient(180deg, rgba(255, 255, 255, .95), rgba(255, 255, 255, .35)) !important
    }

    .rk-bars svg {
      position: absolute;
      left: 0;
      bottom: 0;
      pointer-events: none;
      overflow: visible
    }

    @media(max-width:1250px) {
      .rk-bars {
        opacity: .55;
        transform: scale(.8);
        transform-origin: right bottom
      }
    }

    .rk-o {
      flex: 1.5 1 0 !important
    }

    .rk-oo {
      display: flex;
      gap: clamp(8px, 1vw, 16px);
      margin-top: 4px
    }

    .rk-oo>div {
      flex: 1;
      min-width: 0
    }

    .rk-oo i {
      display: block;
      font-style: normal;
      font-size: clamp(10px, .8vw, 12px);
      font-weight: 700;
      opacity: .95
    }

    .rk-tx .rk-oo b {
      font-size: clamp(11px, .95vw, 14px) !important;
      margin: 1px 0 0 !important;
      text-shadow: none
    }

    @media(max-width:900px) {
      .rkp {
        overflow-x: auto
      }

      .rk {
        min-width: 210px
      }
    }

    /* ===== Top 10 Buyer cards (banner header · gradient bars · customer tooltip) ===== */
    .c.bq {
      padding: 0;
      overflow: hidden;
      border-radius: 18px
    }

    .bq .bh {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 20px;
      color: #fff;
      font-weight: 800;
      font-size: clamp(15px, 1.35vw, 21px)
    }

    .bq.bh-h .bh {
      background: linear-gradient(90deg, #6b0719, #a61935 60%, #c8102e)
    }

    .bq.bh-s .bh {
      background: linear-gradient(90deg, #0a3a8f, #1259c4 60%, #1b7fe0)
    }

    .bq .bh svg {
      width: 30px;
      height: 30px;
      flex: none
    }

    .bq .bh i {
      width: 1px;
      height: 26px;
      background: rgba(255, 255, 255, .55)
    }

    .bq .bb {
      padding: 12px 20px 16px
    }

    .br {
      display: grid;
      grid-template-columns: minmax(90px, 150px) 1fr 62px;
      align-items: center;
      gap: 14px;
      padding: 5px 6px;
      border-radius: 8px;
      cursor: default
    }

    .br:hover {
      background: #f3f6fc
    }

    .br em {
      font-style: normal;
      text-align: right;
      font-weight: 700;
      font-size: 13px;
      color: #2b4270;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .br u {
      display: block;
      height: 14px;
      border-radius: 9px;
      background: #e9edf5;
      overflow: hidden;
      text-decoration: none
    }

    .br u s {
      display: block;
      height: 100%;
      border-radius: 9px;
      text-decoration: none
    }

    .bq.bh-h .br u s {
      background: linear-gradient(90deg, #7a0a1c, #e0142f)
    }

    .bq.bh-s .br u s {
      background: linear-gradient(90deg, #0a5fb5, #19b6e8)
    }

    .br b {
      font-weight: 800;
      color: #0f2a5a;
      font-size: 13.5px
    }

    .c.bsum {
      display: flex;
      align-items: center;
      padding: 14px 6px
    }

    .bsum .bi {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 24px;
      border-right: 1px solid #d8e0ee;
