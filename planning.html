            cal: S('<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18M8 14h2M12 14h2M16 14h2M8 17h2M12 17h2"/>'),
            chv: '<svg class="chv" viewBox="0 0 24 24" fill="none" stroke="#cfe0ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
            gear: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm9 4.5v-2l-2.1-.5a7 7 0 0 0-.8-1.9l1.1-1.9-1.4-1.4-1.9 1.1a7 7 0 0 0-1.9-.8L13.5 3h-2l-.5 2.1a7 7 0 0 0-1.9.8L7.2 4.8 5.8 6.2l1.1 1.9a7 7 0 0 0-.8 1.9L4 10.5v2l2.1.5c.2.7.5 1.3.8 1.9l-1.1 1.9 1.4 1.4 1.9-1.1c.6.3 1.2.6 1.9.8l.5 2.1h2l.5-2.1c.7-.2 1.3-.5 1.9-.8l1.9 1.1 1.4-1.4-1.1-1.9c.3-.6.6-1.2.8-1.9z"/></svg>',
            swap: S('<path d="M17 3l4 4-4 4M3 11V9a2 2 0 0 1 2-2h16M7 21l-4-4 4-4M21 13v2a2 2 0 0 1-2 2H3"/>'),
            wr: S('<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.2-.6-.6-2.2z"/>'),
            fac: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 21V10l6 3.6V10l6 3.6V4h3.4v9.6H22V21z"/><path fill="rgba(0,0,0,.28)" d="M5 17h2.2v2.2H5zM10 17h2.2v2.2H10zM15 17h2.2v2.2H15z"/></svg>',
            doc: S('<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6M9 9h2"/>'),
            calok: S('<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18M8.5 15.5l2.5 2.5 4.5-5"/>'),
            calclk: S('<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/><circle cx="15" cy="16" r="3.6"/><path d="M15 14.4v1.8l1.1.7"/>'),
            trend: S('<rect x="3" y="14" width="4" height="7" rx="1"/><rect x="10" y="10" width="4" height="11" rx="1"/><rect x="17" y="6" width="4" height="15" rx="1"/><path d="M3 9l5-4 4 3 7-6M15 2h4v4"/>'),
            ill: '<svg viewBox="0 0 120 84"><g transform="rotate(-8 60 44)"><rect x="14" y="12" width="78" height="62" rx="8" fill="#1b4fb8" stroke="#7dd3fc" stroke-width="2"/><rect x="14" y="12" width="78" height="14" rx="8" fill="#2f6fe0"/><path d="M34 6v12M72 6v12" stroke="#e0f2fe" stroke-width="4" stroke-linecap="round"/><g fill="#dbeafe" opacity=".9"><rect x="22" y="32" width="12" height="9" rx="2"/><rect x="40" y="32" width="12" height="9" rx="2"/><rect x="58" y="32" width="12" height="9" rx="2"/><rect x="22" y="46" width="12" height="9" rx="2"/><rect x="40" y="46" width="12" height="9" rx="2"/></g></g><circle cx="88" cy="56" r="20" fill="#0b2a70" stroke="#7dd3fc" stroke-width="3"/><path d="M88 44v12l8 5" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/></svg>'
        };
        function calMonth(y, m) {
            const first = new Date(y, m, 1).getDay(), dim = new Date(y, m + 1, 0).getDate(), now = new Date();
            const today = now.getFullYear() === y && now.getMonth() === m ? now.getDate() : 0;
            let cells = "SuMoTuWeThFrSa".match(/../g).map(w => `<span class="w">${w}</span>`).join("") + "<span></span>".repeat(first);
            for (let d = 1; d <= dim; d++) {
                const key = `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`, s = CAL_DAYS[key] || "";
                cells += `<span class="${s}${d === today ? " t" : ""}">${d}</span>`
            }
            return `<div class="yc-mo" style="--mc:${MCOL[m]}"><div class="yc-mh"><em>${MI[m]}</em><b>${MN[m]}</b><u>${dim} Days</u></div><div class="yc-dg">${cells}</div></div>`
        }
        function calToast(t) { const e = document.createElement("div"); e.className = "yc-toast"; e.textContent = t; document.body.appendChild(e); setTimeout(() => e.remove(), 1800) }
        function renderCal() {
            const ys = calYears(), cy = new Date().getFullYear();
            if (!ys.includes(CALY)) CALY = ys.includes(cy) ? cy : ys[0];
            const total = new Date(CALY, 1, 29).getDate() === 29 ? 366 : 365, pre = CALY + "-";
            const yk = Object.keys(CAL_DAYS).filter(k => k.startsWith(pre));
            const open = yk.filter(k => CAL_DAYS[k] === "unp").length;
            const planned = yk.filter(k => ["prod", "chg", "mnt"].includes(CAL_DAYS[k])).length;
            const work = planned + open, pct = work ? Math.round(planned / work * 100) : 0;
            const btn = (c, ic, t, s) => `<button class="yc-btn ${c}" data-s="${t}"><span class="bi">${ic}</span><span><b>${t}</b><small>${s}</small></span></button>`;
            $("#pgc").innerHTML = `<div class="yc">
            <div class="yc-top">
                <div class="yc-ic">${I.cal}</div><div class="yc-sep"></div>
                <div class="yc-t"><b>Yearly Calendar</b><span>Annual Production Schedule Overview</span>${calStale()}</div>
                <label class="yc-yr">${I.cal}<select id="cy">${ys.map(y => `<option value="${y}"${y === CALY ? " selected" : ""}>${y}</option>`).join("")}</select>${I.chv}</label>
                <span class="yc-sp"></span>
                <div class="yc-tag">Plan Smart<i>•</i>Produce Better</div>
                <div class="yc-ill">${I.ill}</div>
            </div>
            <div class="yc-st">
                <div class="yc-card b"><div class="ci">${I.fac}</div><div class="cl"></div><div><small>Total Months</small><strong>12</strong></div></div>
                <div class="yc-card g"><div class="ci">${I.calok}</div><div><small>Planned Days</small><strong>${planned}</strong></div></div>
                <div class="yc-card o"><div class="ci">${I.calclk}</div><div><small>Open Plans</small><strong>${open}</strong></div></div>
                <div class="yc-card v"><div class="ci">${I.trend}</div><div><small>Production Plan</small><strong>${pct}%</strong></div></div>
            </div>
            <div class="yc-lg">
                <span><i style="--k:#22c55e"></i>Production</span><span><i style="--k:#f97316"></i>Changeover</span><span><i style="--k:#ef4444"></i>Maintenance</span><span><i style="--k:#3b82f6"></i>Holiday</span><span><i style="--k:#a855f7"></i>Unplanned</span>
            </div>
            <div class="yc-gr">${MN.map((_, m) => calMonth(CALY, m)).join("")}</div>
            <div class="yc-ct">
                <div class="yc-ch">${I.gear}<div><b>Planning Controls</b><small>Manage Your Annual Plan</small></div></div>
                <div class="yc-vs"></div>
                ${btn("b", I.cal, "Holiday Setup", "Manage Holidays")}
                ${btn("g", I.swap, "Changeover Setup", "Set Changeover Plan")}
                ${btn("o", I.wr, "Maintenance Setup", "Plan Maintenance")}
                ${btn("v", I.fac, "Machine Plan", "Plan Machines")}
                <div class="yc-vs"></div>
                ${btn("r", I.doc, "Yearly Report", "View &amp; Export")}
            </div>
        </div>`;
            $("#cy").onchange = e => { CALY = +e.target.value; renderCal() };
            $("#pgc").querySelectorAll(".yc-btn").forEach(b => b.onclick = () => b.dataset.s === "Holiday Setup" ? PlanCal.openSetup() : b.dataset.s === "Machine Plan" ? runMachinePlan() : calToast(b.dataset.s + " – coming soon"))
        }
        function show(k) {
            if (!SEC[k] && k !== "cal") k = "pi"; CUR = k;
            document.querySelectorAll(".nv[data-p]").forEach(n => n.classList.toggle("on", n.dataset.p === k));
            const isCal = k === "cal"; $("#pt").style.display = $("#ps").style.display = (isCal || k === "pi" || k === "sch") ? "none" : ""; $("main").classList.toggle("calm", isCal);
            if (!isCal) { $("#pt").textContent = SEC[k].name; $("#ps").textContent = SEC[k].sub }
            (isCal ? renderCal() : showSec(k)); location.hash = k
        }
        (async () => {
            const ME = await ERP.require(); if (!ME) return;
            const nm = ME.name || ME.login_id; $("#un").textContent = nm; $("#av").textContent = nm.slice(0, 2).toUpperCase();
            const hr = new Date().getHours(); $("#gr").textContent = `Good ${hr < 12 ? "morning" : hr < 17 ? "afternoon" : "evening"}, ${nm.split(" ")[0]}. Here is your operation at a glance.`;
            if (ME.role === "admin") $("#adm").style.display = "block";
            $("#ub").onclick = e => { e.stopPropagation(); const m = $("#mn"); m.style.display = m.style.display === "block" ? "none" : "block" }; document.onclick = () => $("#mn").style.display = "none";
            const mods = await ERP.tree(), M = mods.find(x => /production/i.test(String(x.name)));
            if (!M || !(ERP.can(ME, M.id) || M.subs.some(s => ERP.can(ME, s.id, "v", M.id)))) { location.replace("portal.html"); return }
            PS = M.subs.find(ERP.isPlanSub) || null;
            if (PS) await PlanCal.init({ PS, ME, DAYS: CAL_DAYS, onChange: () => { if (CUR === "cal") renderCal() } });   /* Phase 1: Calendar Master → calendar (mode-isolated) */
            ERP.sideBanner([M.id, ...M.subs.map(s => s.id)], PS ? ERP.PLAN.map(x => [PS.id, x.file]) : []);
            show(location.hash.slice(1))
        })().catch(e => console.error(e));
    </script>
</body>
