<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Mainetti · ERP Portal</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f2a5a;--red:#a61935;--mute:#6d7c99;--line:#dbe4f2}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:linear-gradient(180deg,#f3f7fd,#e9f0fa);color:var(--navy);height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{background:linear-gradient(100deg,#5c0716,#8d0b20 45%,#b3122f);color:#fff;padding:14px 34px;display:flex;align-items:center;gap:16px;box-shadow:0 8px 26px rgba(100,10,30,.25)}
.logo{font-weight:800;letter-spacing:.06em;font-size:18px;line-height:1}.logo small{display:block;font-size:9px;font-weight:600;letter-spacing:.2em;opacity:.8;margin-top:3px}
.sep{width:1px;height:34px;background:rgba(255,255,255,.35)}.ttl{flex:1}.ttl b{font-size:20px;display:block}.ttl span{font-size:13px;opacity:.85}
.user{position:relative}.ub{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:999px;padding:6px 16px 6px 6px;font-weight:600;cursor:pointer;font-size:14px}
.av{width:32px;height:32px;border-radius:50%;background:#fff;color:var(--red);display:grid;place-items:center;font-weight:800;font-size:13px}
.menu{position:absolute;right:0;top:48px;background:#fff;color:var(--navy);border-radius:12px;box-shadow:0 14px 34px rgba(16,44,92,.25);min-width:170px;display:none;overflow:hidden;z-index:5}
.menu div{padding:12px 16px;cursor:pointer;font-weight:600}.menu div:hover{background:#f1f5fc}
main{flex:1;min-height:0;width:100%;max-width:1560px;margin:0 auto;padding:20px 28px 14px;display:flex}
.grid{flex:1;min-height:0;display:grid;gap:14px;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr))}
.card{container-type:inline-size;position:relative;overflow:hidden;border-radius:18px;padding:14px 14px;min-height:0;display:flex;flex-direction:column;justify-content:space-between;border:1px solid rgba(0,0,0,.05);box-shadow:0 8px 22px rgba(16,44,92,.07);transition:.2s}
.card.ok{cursor:pointer}.card.ok:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(16,44,92,.14)}.card.lock{filter:grayscale(.6);opacity:.7}
.ic{width:42px;height:42px;border-radius:12px;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.75)}.ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;align-items:center;gap:14px}.row{flex-wrap:nowrap}.row h3{margin:0;font-size:clamp(14px,4cqw,18px);flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--navy)}
@container (max-width:430px){.row{gap:8px}.row h3{font-weight:600}.ic{width:34px;height:34px}.card .chip{position:absolute;top:10px;right:10px;font-size:0;letter-spacing:0;padding:0;width:9px;height:9px;overflow:hidden;border-radius:50%;background:#aab6cc;border:0}.card .chip.on{background:#1f9d55;box-shadow:0 0 0 3px rgba(31,157,85,.2)}}
.chip{font-size:10px;font-weight:700;letter-spacing:.1em;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.8);border:1px solid rgba(0,0,0,.08);color:var(--mute)}
.chip.on{color:#1f9d55}
.card p{margin:6px 0;font-size:12.5px;line-height:1.45;color:#3a4d73;max-width:88%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.grid.tight p{display:none}.grid.mini .btn,.grid.mini .no{display:none}.grid.mini .card{justify-content:center;padding:6px 12px}.grid.mini .ic{width:28px;height:28px}.grid.mini .ic svg{width:17px;height:17px}
.btn,.no{align-self:flex-start}
.btn{border:0;border-radius:99px;padding:9px 18px;font-weight:700;font-size:13px;color:#fff;cursor:pointer}
.no{display:inline-block;border:1px dashed #aab6cc;border-radius:99px;padding:8px 16px;font-size:13px;color:var(--mute);font-weight:600}
.num{position:absolute;right:16px;bottom:10px;font-size:11px;color:rgba(0,0,0,.28);font-weight:700}
.wm{position:absolute;right:-10px;bottom:-12px;width:110px;height:110px;opacity:.1;pointer-events:none}.wm svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.4}
.pm{position:absolute;left:20px;bottom:8px;display:none}
footer{flex:none;text-align:center;color:var(--mute);font-size:12px;padding:9px;border-top:1px solid var(--line)}
#ov{position:fixed;inset:0;background:rgba(10,25,60,.55);display:none;place-items:center;z-index:9;padding:16px}
.mod{background:#fff;border-radius:20px;width:900px;max-width:100%;max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.mh{padding:20px 24px;color:#fff;display:flex;align-items:center;gap:12px}.mh h3{margin:0;flex:1;font-size:20px}.x{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:50%;width:34px;height:34px;font-size:18px;cursor:pointer}
.tabs{display:flex;gap:6px;padding:12px 24px 0;flex-wrap:wrap;border-bottom:1px solid var(--line)}.tab{padding:8px 14px;border-radius:10px 10px 0 0;cursor:pointer;font-weight:600;color:var(--mute);font-size:13px}.tab.on{background:#f1f5fc;color:var(--navy)}
.body{padding:18px 24px 24px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{background:#f4f8ff;color:var(--mute);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0}th,td{padding:9px 12px;border-bottom:1px solid var(--line)}
.empty{text-align:center;color:var(--mute);padding:36px}.perm{display:flex;gap:6px;margin-bottom:12px}.perm span{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:#e3ecfb}.perm .off{opacity:.35}
@media(max-width:700px){header{padding:10px 14px}.ttl span{display:none}.ttl b{font-size:17px}.logo{font-size:14px}.sep{height:26px}main{padding:12px 12px 8px}.grid{gap:8px}.card{padding:10px 12px}.chip{display:none}.ic{width:34px;height:34px}.num,.wm{display:none}}
</style></head><body>
<header><div class="logo">MAINETTI<small>BANGLADESH</small></div><div class="sep"></div><div class="ttl"><b>ERP Portal</b><span id="gr"></span></div>
<div class="user"><button class="ub" id="ub"><span class="av" id="av"></span><span id="un"></span> ▾</button><div class="menu" id="mn"><div id="adm" style="display:none" onclick="location.href='admin.html'">Admin Console</div><div onclick="out()">Sign out</div></div></div></header>
<main><div class="grid" id="g"></div></main>
<footer>Mainetti Bangladesh — Hanger Manufacturing ERP · v1.0.0</footer>
<div id="ov"><div class="mod" id="md"></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const me=sessionStorage.getItem("erp_user");if(!me)location.replace("index.html");
const M0=["Order","RMS – Raw Material Store","Mixer Room","Production & Planning","Technical","Quality","FG – Finish Good","Delivery","HR – Human Resource","Learning & Development","Document Manager","Report & Analysis","Settings"];
const DESC=["Customer orders, order confirmation, revisions and status tracking from receipt to dispatch.","Incoming material receipt, inspection, storage locations, stock levels and issue to the floor.","Batch recipes, colour matching, mixing logs and consumption against each production order.","Order planning, machine loading, daily output, downtime and delivery commitment tracking.","Mould and machine records, maintenance schedules, breakdowns, spares and technical changes.","In-process and final inspection, non-conformance handling, rejection analysis and complaints.","Finished goods receipt, packing, stock position and dispatch planning.","Delivery schedule, vehicle and challan management, and customer receipt confirmation.","Employee master, attendance, manpower deployment, leave and shift-wise headcount.","Training calendar, attendance, skill matrix and competency assessment across operations.","Controlled SOPs, work instructions, formats and records with versions and review dates.","Management reports, KPI dashboards and cross-module analysis for decisions.","System preferences, master data and portal configuration."];
const IC=["M9 4h6v3H9zM7 5H5v16h14V5h-2M9 12h6M9 16h4","M3 10l9-6 9 6v10H3zM8 20v-6h8v6","M9 3h6M10 3v6l-5 10a2 2 0 002 3h10a2 2 0 002-3l-5-10V3M8 15h8","M12 8a4 4 0 100 8 4 4 0 000-8zM12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2","M14 6a4 4 0 005 5l-9 9a2.8 2.8 0 01-4-4l9-9z","M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM8.5 12l2.5 2.5 4.5-5","M12 3l8 4.5v9L12 21l-8-4.5v-9zM4 7.5l8 4.5 8-4.5M12 12v9","M2 6h12v10H2zM14 9h4l4 4v3h-8zM6 19a2 2 0 100-4 2 2 0 000 4zM17 19a2 2 0 100-4 2 2 0 000 4z","M9 11a3.5 3.5 0 100-7 3.5 3.5 0 000 7zM2 20c0-4 3-6 7-6s7 2 7 6M17 5a3 3 0 010 6M19 14c2 .6 3 2.5 3 5","M2 9l10-5 10 5-10 5zM6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5","M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h6","M4 20V10M10 20V4M16 20v-8M22 20H2","M4 6h10M18 6h2M4 12h2M10 12h10M4 18h12M14 4v4M8 10v4M16 16v4"];
const CL=[["#fff6dc","#c58a00"],["#e3f6fb","#0b8aa6"],["#e4eeff","#2563eb"],["#ece8ff","#6d4aff"],["#e4f6ec","#1f9d55"],["#ffebe3","#e0562f"],["#fde8f1","#d6336c"],["#f1ebff","#7c4dff"],["#e9eff6","#4b647f"],["#ffefdc","#d9730d"],["#e5f2ff","#1d6fb8"],["#f6e6ec","#a61935"],["#eceff3","#51607a"]];
let D=null;try{D=JSON.parse(localStorage.getItem("mainetti_admin_v1"))}catch(e){}
const rec=D&&D.users.find(u=>u.id.toLowerCase()===(me||"").toLowerCase());
if(D&&rec&&!rec.active)out();
const full=!rec||rec.role==="admin";                 // test login (Farhad) and admins see everything
const mods=D?D.mods:M0.map((n,i)=>({id:"d"+i,name:n,subs:[]}));
const can=(id,k="v")=>full||!!rec.perm?.[id]?.[k];
const nodeOk=m=>can(m.id)||m.subs.some(s=>can(s.id));
function out(){sessionStorage.removeItem("erp_user");location.replace("index.html")}
const nm=rec?.name||me||"";$("#un").textContent=nm;$("#av").textContent=nm.slice(0,2).toUpperCase();
const hr=new Date().getHours();$("#gr").textContent=`Good ${hr<12?"morning":hr<17?"afternoon":"evening"}, ${nm.split(" ")[0]}. Here is your operation at a glance.`;
if(rec&&rec.role==="admin")$("#adm").style.display="block";
$("#ub").onclick=e=>{e.stopPropagation();const m=$("#mn");m.style.display=m.style.display==="block"?"none":"block"};document.onclick=()=>$("#mn").style.display="none";
$("#g").innerHTML=mods.map((m,i)=>{const ok=nodeOk(m),[bg,ac]=CL[i%13],ic=IC[i%13];
 return`<div class="card ${ok?"ok":"lock"}" ${ok?`onclick="openM('${m.id}')"`:""} style="background:linear-gradient(135deg,${bg},#fff 140%);color:${ac}"><div class="row"><div class="ic" style="color:${ac}"><svg viewBox="0 0 24 24"><path d="${ic}"/></svg></div><h3>${esc(m.name.replace(/^(\w+) – /,""))}</h3><span class="chip ${ok?"on":""}">${ok?"● ACCESS":"LOCKED"}</span></div>
 <p>${esc(DESC[i]||"Module data and records managed from the Admin Console.")}</p>${ok?`<button class="btn" style="background:${ac}">Open ${esc(m.name.replace(/^(\w+) – /,""))} →</button>`:`<span class="no">No access</span>`}
 <div class="wm" style="color:${ac}"><svg viewBox="0 0 24 24"><path d="${ic}"/></svg></div><span class="num">${String(i+1).padStart(2,"0")}</span></div>`}).join("");
function layout(){const g=$("#g"),n=g.children.length,W=g.clientWidth,H=g.clientHeight,gap=innerWidth<700?8:14;let best=2,sc=1e9;
 for(let c=innerWidth<700?1:2;c<=(innerWidth<700?1:7);c++){const r=Math.ceil(n/c),w=(W-gap*(c-1))/c,h=(H-gap*(r-1))/r,v=Math.abs(Math.log((w/h)/1.75))+(r*c-n)*.03;if(v<sc){sc=v;best=c}}
 const r=Math.ceil(n/best),h=(H-gap*(r-1))/r;g.style.gridTemplateColumns=`repeat(${best*2},minmax(0,1fr))`;[...g.children].forEach((c,i)=>{c.style.gridColumn="span 2"});const k=n-(r-1)*best;if(k<best&&k>0)g.children[n-k].style.gridColumn=`${best-k+1} / span 2`;g.style.gridTemplateRows=`repeat(${r},minmax(0,1fr))`;g.classList.toggle("tight",h<170);g.classList.toggle("mini",h<112);fitT()}
function fitT(){const hs=[...document.querySelectorAll(".row h3")];let f=21;const set=v=>hs.forEach(h=>h.style.fontSize=v+"px");set(f);while(f>10.5&&hs.some(h=>h.scrollWidth>h.clientWidth+1)){f-=.5;set(f)}}
addEventListener("resize",layout);layout();if(document.fonts)document.fonts.ready.then(layout);
let cur=null;
function openM(id){cur=mods.find(m=>m.id===id);if(/deliver/i.test(cur.name)){location.href="delivery.html";return}const i=mods.indexOf(cur),[bg,ac]=CL[i%13];$("#ov").style.display="grid";
 $("#md").innerHTML=`<div class="mh" style="background:${ac}"><h3>${esc(cur.name)}</h3><button class="x" onclick="shut()">✕</button></div><div class="tabs" id="tb"></div><div class="body" id="bd"></div>`;
 const t=[cur,...cur.subs].filter(n=>can(n.id));$("#tb").innerHTML=t.map((n,j)=>`<div class="tab ${j?"":"on"}" onclick="tab('${n.id}',this)">${j===0||n===cur?"Overview":esc(n.name)}</div>`).join("");
 tab(t[0].id)}
function tab(id,el){if(el){document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));el.classList.add("on")}
 const d=D&&D.data[id],sub=cur.subs.find(s=>s.id===id);
 $("#bd").innerHTML=`<div class="perm">${[["v","View"],["a","Add"],["e","Edit"],["d","Delete"]].map(([k,n])=>`<span class="${can(id,k)?"":"off"}">${n}</span>`).join("")}</div><h3 style="margin:0 0 10px">${esc(sub?sub.name:cur.name)}</h3>`+
 (d?`<div style="overflow:auto;max-height:50vh"><table><tr>${d.cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr>${d.rows.slice(0,300).map(r=>`<tr>${d.cols.map((c,j)=>`<td>${esc(r[j])}</td>`).join("")}</tr>`).join("")}</table></div><p style="color:var(--mute);font-size:12px">${d.rows.length} rows${d.rows.length>300?" (first 300 shown)":""}</p>`:`<div class="empty">No data uploaded for this section yet.</div>`)}
function shut(){$("#ov").style.display="none"}$("#ov").onclick=e=>{if(e.target.id==="ov")shut()};
</script></body></html>
