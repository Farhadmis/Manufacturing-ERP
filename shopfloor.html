<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Mainetti · Production-Shop floor</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0f2a5a;
            --red: #a61935;
            --mute: #6d7c99;
            --line: #dbe4f2;
            --gold: #e0b24a
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: Inter, system-ui, sans-serif;
            color: var(--navy);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #f1f5fb;
            font-size: 13px
        }

        /* ===== header ===== */
        header {
            flex: none;
            position: relative;
            z-index: 60;
            display: flex;
            align-items: stretch;
            height: clamp(66px, 9vh, 88px);
            background: linear-gradient(90deg, #f8fbff, #e8f0fc);
            box-shadow: 0 4px 18px rgba(16, 44, 92, .12)
        }

        .hl {
            display: flex;
            align-items: center;
            gap: clamp(12px, 1.5vw, 24px);
            padding: 0 clamp(14px, 1.8vw, 30px);
            position: relative;
            z-index: 2;
            flex: none
        }

        .hl img {
            height: clamp(40px, 6.2vh, 58px);
            display: block
        }

        .logo {
            font-weight: 800;
            letter-spacing: .06em;
            font-size: 20px;
            line-height: 1;
            color: var(--navy)
        }

        .logo small {
            display: block;
            font-size: 9px;
            letter-spacing: .2em;
            margin-top: 3px;
            color: #12408f
        }

        .sep {
            width: 1px;
            height: 46px;
            background: #9fb3d3;
            flex: none
        }

        .tag {
            font-style: italic;
            font-weight: 600;
            color: #12408f;
            font-size: clamp(12px, 1.15vw, 18px);
            white-space: nowrap
        }

        .tag i {
            font-style: normal;
            margin: 0 .7em;
            opacity: .55
        }

        .gr {
            font-size: 11.5px;
            color: var(--mute);
            margin-top: 3px;
            white-space: nowrap
        }

        .hp {
            flex: 1;
            min-width: 0;
            position: relative;
            overflow: hidden
        }

        .hp::before {
            content: "";
            position: absolute;
            inset: 0;
            background: url(assets/header-photo.jpg) right center/cover no-repeat;
            -webkit-mask-image: linear-gradient(90deg, transparent, #000 40%);
            mask-image: linear-gradient(90deg, transparent, #000 40%)
        }

        .hr {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: clamp(10px, 1.2vw, 18px);
            padding: 0 clamp(14px, 1.6vw, 26px) 0 clamp(54px, 5vw, 84px);
            color: #fff;
            flex: none
        }

        .hr::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(100deg, #0a2a70, #0b3d94);
            clip-path: polygon(44px 0, 100% 0, 100% 100%, 0 100%);
            z-index: -1
        }

        .hr svg.fy {
            width: clamp(30px, 2.6vw, 42px);
            height: clamp(30px, 2.6vw, 42px);
            flex: none
        }

        .ht b {
            display: block;
            font-size: clamp(15px, 1.5vw, 23px);
            font-weight: 800;
            white-space: nowrap
        }

        .ht span {
            display: block;
            font-size: clamp(9.5px, .8vw, 12px);
            opacity: .92;
            margin-top: 2px;
            white-space: nowrap
        }

        .user {
            position: relative
        }

        .ub {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, .14);
            border: 1px solid rgba(255, 255, 255, .4);
            color: #fff;
            border-radius: 999px;
            padding: 4px 14px 4px 4px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit
        }

        .av {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #fff;
            color: #0b3d94;
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: 12px
        }

        .menu {
            position: absolute;
            right: 0;
            top: 46px;
            background: #fff;
            color: var(--navy);
            border-radius: 12px;
            box-shadow: 0 14px 34px rgba(16, 44, 92, .25);
            min-width: 170px;
            display: none;
            overflow: hidden;
            z-index: 30
        }

        .menu div {
            padding: 12px 16px;
            cursor: pointer;
            font-weight: 600
        }

        .menu div:hover {
            background: #f1f5fc
        }

        /* ===== layout ===== */
        .bk {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 1px solid #9fb3d3;
            background: #fff;
            color: var(--navy);
            font-size: 18px;
            cursor: pointer;
            flex: none
        }

        .lay {
            flex: 1;
            min-height: 0;
            display: flex
        }

        aside {
            flex: none;
            width: 250px;
            background: #fff;
            border-right: 1px solid var(--line);
            padding: 10px 0;
            transition: .2s;
            overflow: hidden
        }

        aside.col {
            width: 62px
        }

        .nv {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 20px;
            cursor: pointer;
            font-weight: 600;
            color: #3a4d73;
            border-left: 3px solid transparent
        }

        .nv span {
            line-height: 1.25
        }

        aside.col .nv span {
            white-space: nowrap
        }

        .nv svg {
            width: 20px;
            height: 20px;
            flex: none;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.9;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .nv:hover {
            background: #f5f8fd
        }

        .nv.on {
            color: var(--red);
            background: #fdeff2;
            border-left-color: var(--red)
        }

        .nv.t {
            color: var(--mute);
            margin-bottom: 6px
        }

        main {
            flex: 1;
            min-width: 0;
            overflow: auto;
            padding: 0 22px 30px
        }

        .ttl {
            font-size: 20px;
            font-weight: 800;
            margin: 18px 0 2px
        }

        .sub {
            color: var(--mute);
            margin: 0 0 14px
        }

        .empty {
            background: #fff;
            border-radius: 16px;
            padding: 60px 20px;
            text-align: center;
            color: var(--mute)
        }

        .empty b {
            display: block;
            color: var(--navy);
            font-size: 17px;
            margin-bottom: 6px
        }

        @media(max-width:900px) {
            body {
                height: 100dvh;
                overflow: hidden
            }

            aside {
                width: 62px
            }

            .nv span {
                display: none
            }

            .hl {
                padding: 8px 12px
            }
        }

        /* ===== Production Performance page ===== */
        .fbw {
            position: sticky;
            top: 0;
            z-index: 40;
            background: #f1f5fb;
            margin: 0 -22px;
            padding: 10px 22px 8px
        }

        .fb {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 9px 10px;
            border-radius: 18px;
            border: 1px solid #dbe4f2;
            white-space: nowrap;
            overflow-x: auto;
            scrollbar-width: thin;
            background: radial-gradient(150px 46px at 0% 100%, rgba(15, 42, 90, .14), transparent), radial-gradient(190px 54px at 100% 0%, rgba(224, 178, 74, .28), transparent), linear-gradient(180deg, #fff, #f5f9ff);
            box-shadow: 0 6px 18px rgba(16, 44, 92, .10), inset 0 0 0 1px rgba(255, 255, 255, .9)
        }

        .fp {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: none;
            border: 1px solid #e3eaf6;
            background: #fff;
            border-radius: 999px;
            padding: 6px 10px;
            font: 600 12px Inter, sans-serif;
            color: var(--navy);
            cursor: pointer;
            box-shadow: 0 1px 3px rgba(16, 44, 92, .08);
            transition: .15s
        }

        .fp:hover {
            border-color: #b9c9e6
        }

        .fp svg {
            width: 15px;
            height: 15px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.9;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex: none
        }

        .fp .fl {
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .fp svg.cv {
            width: 9px;
            height: 9px;
            opacity: .7
        }

        .fp.on {
            background: var(--navy);
            color: #fff;
            border-color: var(--navy)
        }

        .fp.dis {
            opacity: .45;
            cursor: not-allowed
        }

        .fp .ct {
            background: var(--red);
            color: #fff;
            border-radius: 99px;
            font-size: 10px;
            padding: 1px 6px;
            line-height: 1.4
        }

        .fd {
            display: flex;
            align-items: center;
            gap: 5px;
            flex: none;
            font: 700 11.5px Inter, sans-serif;
            color: var(--mute)
        }

        .fd input {
            border: 1px solid #e3eaf6;
            border-radius: 999px;
            padding: 5px 8px;
            font: 600 12px Inter, sans-serif;
            color: var(--navy);
            width: 124px;
            background: #fff
        }

        .fsep {
            width: 1px;
            height: 24px;
            background: #cfd9ec;
            flex: none;
            margin: 0 2px
        }

        .rs {
            margin-left: auto;
            flex: none;
            background: var(--navy);
            color: #fff;
            border: 2px solid var(--gold);
            border-radius: 999px;
            padding: 6px 16px;
            font: 700 13px Inter, sans-serif;
            cursor: pointer;
            display: flex;
            gap: 6px;
            align-items: center
        }

        .rs svg {
            width: 15px;
            height: 15px;
            stroke: #fff;
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .pop {
            position: fixed;
            z-index: 200;
            width: 230px;
            background: #fff;
            border-radius: 14px;
            border: 1px solid #dbe4f2;
            box-shadow: 0 16px 38px rgba(16, 44, 92, .28);
            display: none;
            flex-direction: column;
            overflow: hidden
        }

        .pop.on {
            display: flex
        }

        .pop input {
            margin: 10px 10px 6px;
            border: 1px solid #dbe4f2;
            border-radius: 9px;
            padding: 7px 9px;
            font: 500 12.5px Inter, sans-serif;
            color: var(--navy);
            outline: none
        }

        .pop .ls {
            max-height: 250px;
            overflow: auto;
            padding: 2px 6px
        }

        .pop label {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12.5px
        }

        .pop label:hover {
            background: #f1f5fc
        }

        .pop label input {
            margin: 0;
            width: 15px;
            height: 15px;
            accent-color: var(--navy)
        }

        .pop .ft {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            border-top: 1px solid #eef2f9;
            font-size: 12px;
            font-weight: 700
        }

        .pop .ft a {
            cursor: pointer;
            color: #12408f
        }

        .pop .nt {
            padding: 6px 12px;
            color: var(--mute);
            font-size: 11.5px
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            margin-top: 14px;
            align-items: stretch
        }

        @media(max-width:1100px) {
            .cards {
                grid-template-columns: 1fr
            }
        }

        .cd {
            background: #fff;
            border-radius: 20px;
            border: 1px solid #dbe4f2;
            box-shadow: 0 8px 24px rgba(16, 44, 92, .10);
            overflow: hidden;
            min-width: 0;
            display: flex;
            flex-direction: column
        }

        .cd .ch {
            min-height: 84px;
            position: relative;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px 12px;
            padding: 12px 14px 12px 16px;
            overflow: hidden
        }

        .cd.lt .ch {
            background: linear-gradient(180deg, #fff, #f7faff)
        }

        .cd.dk .ch {
            background: linear-gradient(100deg, #0a2a70, #0b3d94);
            color: #fff
        }

        .cd .ch::after {
            content: "";
            position: absolute;
            left: -46px;
            top: -52px;
            width: 150px;
            height: 104px;
            border-bottom: 3px solid var(--gold);
            border-radius: 0 0 100% 0;
            opacity: .85;
            pointer-events: none
        }

        .cd .ic {
            position: relative;
            z-index: 1;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            flex: none;
            background: linear-gradient(135deg, #0f2a5a, #17479a);
            color: #fff
        }

        .cd.dk .lg {
            color: #cfe0ff
        }

        .cd.dk .lg i {
            border-top-color: #fff
        }

        .cd.dk .ic {
            background: rgba(255, 255, 255, .12)
        }

        .cd .ic svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .cd .tt {
            position: relative;
            z-index: 1;
            flex: 1 1 180px;
            min-width: 0;
            border-left: 1px solid rgba(110, 130, 170, .45);
            padding-left: 12px
        }

        .cd .tt h3 {
            margin: 0;
            font-size: 19px;
            font-weight: 800;
            line-height: 1.15
        }

        .cd .tt p {
            margin: 3px 0 0;
            font-size: 11.5px;
            font-style: italic;
            opacity: .8
        }

        .lg {
            display: flex;
            gap: 10px;
            font-size: 10.5px;
            font-weight: 600;
            color: var(--mute);
            align-items: center;
            position: relative;
            z-index: 1
        }

        .lg i {
            display: inline-block;
            width: 22px;
            border-top: 2px solid var(--navy);
            vertical-align: middle;
            margin-right: 4px
        }

        .lg i.d {
            border-top-style: dashed
        }

        .tg {
            display: flex;
            gap: 6px;
            position: relative;
            z-index: 1
        }

        .tg button {
            display: flex;
            align-items: center;
            gap: 5px;
            border: 1px solid #d3def2;
            background: #fff;
            color: var(--navy);
            border-radius: 999px;
            padding: 6px 11px;
            font: 700 12px Inter, sans-serif;
            cursor: pointer;
            box-shadow: 0 1px 3px rgba(16, 44, 92, .10)
        }

        .tg button svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .tg button.on {
            background: var(--navy);
            color: #fff;
            border-color: var(--navy);
            box-shadow: 0 0 0 2px rgba(224, 178, 74, .55)
        }

        .kps {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
            padding: 12px 14px 4px
        }

        .kp {
            container-type: inline-size;
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(180deg, #fff, #f4f8ff);
            border: 1px solid #dbe4f2;
            border-radius: 16px;
            padding: 10px 12px 10px 10px;
            min-width: 0;
            overflow: hidden
        }

        .kp::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            width: 40px;
            height: 18px;
            background: linear-gradient(135deg, #f6cf6a, #c08a1e);
            border-radius: 0 100% 0 14px;
            opacity: .9
        }

        .kp.best {
            background: linear-gradient(180deg, #f2fcf4, #e2f6e8);
            border-color: #bfe6c9
        }

        .kp .bd {
            position: absolute;
            right: 0;
            top: 0;
            background: linear-gradient(135deg, #f6cf6a, #d9a02a);
            color: #3b2a00;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 10px 2px 14px;
            border-radius: 0 0 0 12px
        }

        @container (max-width: 175px) {
            .kp .ki {
                display: none
            }

            .kp .kb {
                border-left: 0;
                padding-left: 6px
            }
        }

        .kp .ki {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0f2a5a, #17479a);
            display: grid;
            place-items: center;
            flex: none;
            color: #fff;
            position: relative;
            z-index: 1
        }

        .kp .ki svg {
            width: 21px;
            height: 21px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .kp .kb {
            border-left: 1px solid #cfd9ec;
            padding-left: 10px;
            min-width: 0;
            position: relative;
            z-index: 1
        }

        .kp .kl {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .02em;
            text-transform: uppercase;
            line-height: 1.2
        }

        .kp .kv {
            font-size: clamp(14px, 8.4cqw, 26px);
            font-weight: 800;
            line-height: 1.15;
            white-space: nowrap;
            font-variant-numeric: tabular-nums
        }

        .kp.best .kv {
            color: #1f8f3a
        }

        .kp .ks {
            font-size: 10.5px;
            font-weight: 600;
            color: #42557d;
            line-height: 1.25
        }

        .kp .ks small {
            font-weight: 600;
            color: #42557d
        }

        .chip {
            display: inline-block;
            margin-top: 2px;
            padding: 2px 9px;
            border-radius: 999px;
            font-size: 10.5px;
            font-weight: 800
        }

        .chip.up {
            background: #d7f3de;
            color: #17783a
        }

        .chip.dn {
            background: #fde1e3;
            color: #b3261e
        }

        .cvw {
            padding: 4px 12px 8px;
            flex: 1;
            display: flex;
            align-items: center
        }

        .cvw svg {
            width: 100%;
            height: auto;
            display: block;
            font-family: Inter, sans-serif
        }

        .cft {
            display: flex;
            justify-content: center;
            padding: 0 12px 14px
        }

        .cft span {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #fff;
            border: 1px solid #dbe4f2;
            border-radius: 999px;
            padding: 6px 16px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(16, 44, 92, .10)
        }

        .cft svg {
            width: 17px;
            height: 17px;
            stroke: #c08a1e;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        /* filter bar: জায়গা কম হলে ধাপে ধাপে ছোট হয় (JS fitBar) */
        .fb.t1 {
            gap: 4px
        }

        .fb.t1 .fp {
            padding: 6px 8px;
            gap: 5px;
            font-size: 11.5px
        }

        .fb.t1 .fd input {
            width: 108px;
            font-size: 11.5px;
            padding: 5px 6px
        }

        .fb.t2 .fp svg:not(.cv) {
            display: none
        }

        .fb.t2 .fd {
            gap: 3px;
            font-size: 11px
        }

        .bl {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 12px;
            padding: 0 16px 4px;
            font-size: 11px;
            font-weight: 600
        }

        .bl i {
            display: inline-block;
            width: 11px;
            height: 11px;
            border-radius: 3px;
            vertical-align: -1px;
            margin-right: 4px
        }


        /* ===== Shift / Category Contribution cards ===== */
        .cd.sc .tt h3 b {
            color: #ffd23f
        }

        .cd.sc .tt h3 {
            font-size: 17px
        }

        .cd.sc .ch {
            min-height: 72px
        }

        .scb {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            padding: 12px 12px 8px
        }

        .scl {
            flex: 1 1 190px;
            background: linear-gradient(180deg, #fff, #eef4ff);
            border: 1px solid #e3eaf6;
            border-radius: 16px;
            padding: 10px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center
        }

        .scl svg {
            width: 100%;
            max-width: 210px;
            height: auto;
            font-family: Inter, sans-serif
        }

        .scg {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 3px;
            margin-top: 6px;
            font-size: 11.5px;
            font-weight: 800;
            color: var(--navy)
        }

        .scg i {
            display: inline-block;
            width: 11px;
            height: 11px;
            border-radius: 3px;
            margin-right: 6px;
            vertical-align: -1px
        }

        .scg span span {
            color: var(--mute);
            font-weight: 600
        }

        .scr {
            flex: 2.4 1 330px;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
            background: linear-gradient(180deg, #f7faff, #eef4ff);

                    `<div class="ls-n2">${esc(LSB.bayName(b))} · ${esc(LSB.title)} · slice = % of M/C unplanned</div>`;
                document.getElementById("lsdx").onclick = () => p.style.display = "none";
                p.style.display = "block";
                const w = p.offsetWidth, h = p.offsetHeight; let x = e.clientX + 14, yy = e.clientY + 14;
                if (x + w > innerWidth - 8) x = Math.max(8, innerWidth - w - 8); if (yy + h > innerHeight - 8) yy = Math.max(8, innerHeight - h - 8);
                p.style.left = x + "px"; p.style.top = yy + "px";
            }
            document.addEventListener("click", e => {
                const d = document.getElementById("lsdn");
                if (d && d.style.display !== "none" && !e.target.closest("#lsdn") && !e.target.closest(".ls-mn")) d.style.display = "none";
            }, true);
            document.addEventListener("keydown", e => { if (e.key === "Escape") { const d = document.getElementById("lsdn"); if (d) d.style.display = "none" } });
            /* OEE drill popup → M/C click → same "Breakdown Of Losses" donut (ওই M/C-র unplanned category) */
            function lsDonutOE(b, c, e) {
                const o = BD.cur.get(b); if (!o) return; const x = o.mc.get(c); if (!x) return;
                const { D } = P, po = BD.prev.get(b), px = po && po.mc.get(c), m = met(x), pm = px ? met(px) : null, d = pm ? dl(m.E, pm.E) : null;
                const bn = String((D.bayname || [""])[b] ?? "") || "All", mcn = String((D.mcno || [])[c] ?? "").trim() || "—";
                const vis = [["Availability", m.A, "#0f3f9e"], ["Performance", m.P, "#1f6fe5"], ["Quality", m.Q, "#35b4f0"]].map(([lab, v, col]) => ({ lab, v, c: col })).filter(z => z.v != null && z.v > 0);
                const R = 70, Cc = 2 * Math.PI * R, tot = vis.reduce((a, z) => a + z.v, 0) || 1; let acc = 0;
                const arcs = vis.map(z => {
                    const f = z.v / tot, L = f * Cc, mid = (acc + L / 2) / Cc * 2 * Math.PI - Math.PI / 2;
                    const t = `<circle r="${R}" cx="100" cy="100" fill="none" stroke="${z.c}" stroke-width="34" stroke-dasharray="${L} ${Cc - L}" stroke-dashoffset="${-acc}" transform="rotate(-90 100 100)"/>` +
                        `<text x="${(100 + R * Math.cos(mid)).toFixed(1)}" y="${(100 + R * Math.sin(mid) + 4).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">${z.v.toFixed(1)}%</text>`;
                    acc += L; return t;
                }).join("");
                const pc = d == null ? ["#eef3fb", "#6d7c99", "—"] : d >= 0 ? ["#e3f6e8", "#1e7a3c", `▲ +${Math.abs(d).toFixed(1)}%`] : ["#fde8ec", "#c0262d", `▼ −${Math.abs(d).toFixed(1)}%`];
                const leg = vis.map(z => `<div class="ls-lg"><i style="background:${z.c}"></i><span>${z.lab}</span><b style="color:#0f2a5a">${fp(z.v)}</b></div>`).join("");
                let p = document.getElementById("lsdn");
                if (!p) { p = document.createElement("div"); p.id = "lsdn"; document.body.appendChild(p) }
                p.innerHTML = `<div class="ls-h"><b>OEE Breakdown · M/C ${esc(mcn)}</b><span class="ls-x" id="lsdx">✕</span></div>` +
                    `<div class="ls-dw"><svg viewBox="0 0 200 200" class="ls-dsvg">${arcs || `<circle r="${R}" cx="100" cy="100" fill="none" stroke="#e6ecf6" stroke-width="34"/>`}` +
                    `<circle r="50" cx="100" cy="100" fill="#fff"/>` +
                    `<text x="100" y="92" text-anchor="middle" font-size="19" font-weight="800" fill="#0f2a5a">${fp(m.E)}</text>` +
                    `<text x="100" y="106" text-anchor="middle" font-size="10" font-weight="700" fill="#6d7c99">OEE</text>` +
                    `<rect x="88" y="110" width="24" height="2.5" rx="1" fill="#1b56c4"/>` +
                    `<rect x="68" y="118" width="64" height="16" rx="8" fill="${pc[0]}"/>` +
                    `<text x="100" y="129.5" text-anchor="middle" font-size="9.5" font-weight="800" fill="${pc[1]}">${pc[2]}</text></svg></div>` +
                    `<div style="text-align:center;font-size:10.5px;color:#6d7c99;margin-top:-2px">${esc(BD.pl)}</div>` +
                    `<div class="ls-lgs">${leg || "<div class='ls-lg'>No data</div>"}</div>` +
                    `<div class="ls-n2">${esc(bn)} · ${esc(BD.title)} · OEE = Availability × Performance × Quality</div>`;
                document.getElementById("lsdx").onclick = () => p.style.display = "none";
                p.style.display = "block";
                const w = p.offsetWidth, h = p.offsetHeight; let X = e.clientX + 14, Y = e.clientY + 14;
                if (X + w > innerWidth - 8) X = Math.max(8, innerWidth - w - 8); if (Y + h > innerHeight - 8) Y = Math.max(8, innerHeight - h - 8);
                p.style.left = X + "px"; p.style.top = Y + "px";
            }
            window.renderOEE = function () { if (!P || !$("#oeb")) return; ensureTrTip(); const h = build(); $("#oeb").innerHTML = h; $("#oeh").innerHTML = HD; document.querySelectorAll("#oeb .oe-yb").forEach(b => b.onclick = () => { const k = b.dataset.k; HID.has(k) ? HID.delete(k) : HID.add(k); renderOEE() }) };
            window.showOEE = async function () {
                const c = $("#pgc");
                if (!SUB) { c.innerHTML = msg("Production-Shopfloor data source not found", "Create the “Production-Shopfloor” sub-module under Production &amp; Planning in Admin Console."); return }
                if (!PK) c.innerHTML = `<div class="ld">Loading data…</div>`;
                await loadPK(); if (CUR !== "oee") return;
                if (!PK) { c.innerHTML = PKERR === "err" ? msg("Could not load data", "Check your connection or your access to Production-Shopfloor, then reload.") : msg("No data connected yet", "Upload the Production Excel in Admin Console → Data Manager → Production &amp; Planning → Production-Shopfloor."); return }
                c.innerHTML = `<div class="oe-top" id="oeh"></div>` + filterBarHTML() + `<div id="oeb"></div>`; bindFilters(); renderOEE()
            }
        })();
    </script>
    <script id="rsp-v1-js">
        /* ===================== RESPONSIVE v1 · collapsible filter (UI only) ===================== */
        (function () {
            var MQ = matchMedia('(max-width:767px)'), isOpen = false, tmr = 0, obs = null, raf = 0;
            var FUN = '<svg viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg>';
            var CHV = '<svg class="fbv" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>';
            function closePopup() { var p = document.getElementById('pn'); if (p) p.style.display = 'none'; var q = document.getElementById('pop'); if (q) q.classList.remove('on') }
            function setOpen(wrap, on, instant) {
                clearTimeout(tmr);
                if (on) {
                    wrap.style.setProperty('--fbh', wrap.scrollHeight + 'px');
                    if (instant) { wrap.classList.add('open'); wrap.style.setProperty('--fbh', 'none') }
                    else { wrap.classList.add('open'); tmr = setTimeout(function () { wrap.style.setProperty('--fbh', 'none') }, 400) }
                } else {
                    closePopup();
                    if (instant) { wrap.style.setProperty('--fbh', '0px'); wrap.classList.remove('open') }
                    else { wrap.style.setProperty('--fbh', wrap.scrollHeight + 'px'); void wrap.offsetHeight; wrap.style.setProperty('--fbh', '0px'); wrap.classList.remove('open') }
                }
                isOpen = on; sync();
            }
            function count(fb) {
                var n = fb.querySelectorAll('.f button.on,.fp.on').length;
                fb.querySelectorAll('input[type=date]').forEach(function (i) { if (i.value) n++ });
                return n;
            }
            function sync() {
                var fb = document.getElementById('fb'); if (!fb) return;
                var t = document.querySelector('.fbt'); if (!t) return;
                t.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
                var n = count(fb), b = t.querySelector('.fbn'); b.textContent = n ? n + ' active' : '';
                t.hidden = !fb.children.length;
            }
            function ensure() {
                var fb = document.getElementById('fb');
                if (!fb) { document.querySelectorAll('.fbt').forEach(function (t) { t.remove() }); return }
                var wrap = fb.parentElement;
                if (!wrap.classList.contains('fbc')) {
                    wrap = document.createElement('div'); wrap.className = 'fbc';
                    fb.parentNode.insertBefore(wrap, fb); wrap.appendChild(fb);
                    var a = document.createElement('div'); a.className = 'fba';
                    a.innerHTML = '<button type="button" class="fbr">Reset</button><button type="button" class="fbp">Apply</button>';
                    wrap.appendChild(a);
                    a.querySelector('.fbr').onclick = function () { var r = fb.querySelector('.rs'); if (r) r.click(); setTimeout(sync, 60) };
                    a.querySelector('.fbp').onclick = function () { setOpen(wrap, false) };
                    if (isOpen && MQ.matches) setOpen(wrap, true, true);
                    if (obs) obs.disconnect();
                    obs = new MutationObserver(function () { sync() });
                    obs.observe(fb, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });
                }
                var host = fb.closest('.fbw') || wrap;
                var prev = host.previousElementSibling;
                if (!prev || !prev.classList.contains('fbt')) {
                    document.querySelectorAll('.fbt').forEach(function (t) { t.remove() });
                    var t = document.createElement('button'); t.type = 'button'; t.className = 'fbt'; t.setAttribute('aria-expanded', 'false');
                    t.innerHTML = FUN + '<span class="fbl">Filters</span><span class="fbn"></span>' + CHV;
                    t.onclick = function () { var w = document.querySelector('.fbc'); if (w) setOpen(w, !isOpen) };
                    host.parentNode.insertBefore(t, host);
                }
                sync();
            }
            function sched() { cancelAnimationFrame(raf); raf = requestAnimationFrame(ensure) }
            new MutationObserver(sched).observe(document.body, { childList: true, subtree: true });
            document.addEventListener('change', function (e) { if (e.target.closest && e.target.closest('#fb')) sync() });
            (MQ.addEventListener ? MQ.addEventListener.bind(MQ, 'change') : MQ.addListener.bind(MQ))(function () {
                var w = document.querySelector('.fbc'); if (w) { w.style.removeProperty('--fbh'); if (!MQ.matches) w.classList.remove('open') }
                if (!MQ.matches) { isOpen = false; sync() }
            });
            ensure();
        })();
    </script>
