<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Mainetti · Production-Shop floor</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0f2a5a;
            --red: #a61935;
            --mute: #6d7c99;
            --line: #dbe4f2;
            --gold: #e0b24a
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: Inter, system-ui, sans-serif;
            color: var(--navy);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #f1f5fb;
            font-size: 13px
        }

        /* ===== header ===== */
        header {
            flex: none;
            position: relative;
            z-index: 60;
            display: flex;
            align-items: stretch;
            height: clamp(66px, 9vh, 88px);
            background: linear-gradient(90deg, #f8fbff, #e8f0fc);
            box-shadow: 0 4px 18px rgba(16, 44, 92, .12)
        }

        .hl {
            display: flex;
            align-items: center;
            gap: clamp(12px, 1.5vw, 24px);
            padding: 0 clamp(14px, 1.8vw, 30px);
            position: relative;
            z-index: 2;
            flex: none
        }

        .hl img {
            height: clamp(40px, 6.2vh, 58px);
            display: block
        }

        .logo {
            font-weight: 800;
            letter-spacing: .06em;
            font-size: 20px;
            line-height: 1;
            color: var(--navy)
        }

        .logo small {
            display: block;
            font-size: 9px;
            letter-spacing: .2em;
            margin-top: 3px;
            color: #12408f
        }

        .sep {
            width: 1px;
            height: 46px;
            background: #9fb3d3;
            flex: none
        }

        .tag {
            font-style: italic;
            font-weight: 600;
            color: #12408f;
            font-size: clamp(12px, 1.15vw, 18px);
            white-space: nowrap
        }

        .tag i {
            font-style: normal;
            margin: 0 .7em;
            opacity: .55
        }

        .gr {
            font-size: 11.5px;
            color: var(--mute);
            margin-top: 3px;
            white-space: nowrap
        }

        .hp {
            flex: 1;
            min-width: 0;
            position: relative;
            overflow: hidden
        }

        .hp::before {
            content: "";
            position: absolute;
            inset: 0;
            background: url(assets/header-photo.jpg) right center/cover no-repeat;
            -webkit-mask-image: linear-gradient(90deg, transparent, #000 40%);
            mask-image: linear-gradient(90deg, transparent, #000 40%)
        }

        .hr {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: clamp(10px, 1.2vw, 18px);
            padding: 0 clamp(14px, 1.6vw, 26px) 0 clamp(54px, 5vw, 84px);
            color: #fff;
            flex: none
        }

        .hr::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(100deg, #0a2a70, #0b3d94);
            clip-path: polygon(44px 0, 100% 0, 100% 100%, 0 100%);
            z-index: -1
        }

        .hr svg.fy {
            width: clamp(30px, 2.6vw, 42px);
            height: clamp(30px, 2.6vw, 42px);
            flex: none
        }

        .ht b {
            display: block;
            font-size: clamp(15px, 1.5vw, 23px);
            font-weight: 800;
            white-space: nowrap
        }

        .ht span {
            display: block;
            font-size: clamp(9.5px, .8vw, 12px);
            opacity: .92;
            margin-top: 2px;
            white-space: nowrap
        }

        .user {
            position: relative
        }

        .ub {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, .14);
            border: 1px solid rgba(255, 255, 255, .4);
            color: #fff;
            border-radius: 999px;
            padding: 4px 14px 4px 4px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit
        }

        .av {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #fff;
            color: #0b3d94;
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: 12px
        }

        .menu {
            position: absolute;
            right: 0;
            top: 46px;
            background: #fff;
            color: var(--navy);
            border-radius: 12px;
            box-shadow: 0 14px 34px rgba(16, 44, 92, .25);
            min-width: 170px;
            display: none;
            overflow: hidden;
            z-index: 30
        }

        .menu div {
            padding: 12px 16px;
            cursor: pointer;
            font-weight: 600
        }

        .menu div:hover {
            background: #f1f5fc
        }

        /* ===== layout ===== */
        .bk {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 1px solid #9fb3d3;
            background: #fff;
            color: var(--navy);
            font-size: 18px;
            cursor: pointer;
            flex: none
        }

        .lay {
            flex: 1;
            min-height: 0;
            display: flex
        }

        aside {
            flex: none;
            width: 250px;
            background: #fff;
            border-right: 1px solid var(--line);
            padding: 10px 0;
            transition: .2s;
            overflow: hidden
        }

        aside.col {
            width: 62px
        }

        .nv {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 20px;
            cursor: pointer;
            font-weight: 600;
            color: #3a4d73;
            border-left: 3px solid transparent
        }

        .nv span {
            line-height: 1.25
        }

        aside.col .nv span {
            white-space: nowrap
        }

        .nv svg {
            width: 20px;
            height: 20px;
            flex: none;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.9;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .nv:hover {
            background: #f5f8fd
        }

        .nv.on {
            color: var(--red);
            background: #fdeff2;
            border-left-color: var(--red)
        }

        .nv.t {
            color: var(--mute);
            margin-bottom: 6px
        }

        main {
            flex: 1;
            min-width: 0;
            overflow: auto;
            padding: 0 22px 30px
        }

        .ttl {
            font-size: 20px;
            font-weight: 800;
            margin: 18px 0 2px
        }

        .sub {
            color: var(--mute);
            margin: 0 0 14px
        }

        .empty {
            background: #fff;
            border-radius: 16px;
            padding: 60px 20px;
            text-align: center;
            color: var(--mute)
        }

        .empty b {
            display: block;
            color: var(--navy);
            font-size: 17px;
            margin-bottom: 6px
        }

        @media(max-width:900px) {
            body {
                height: 100dvh;
                overflow: hidden
            }

            aside {
                width: 62px
            }

            .nv span {
                display: none
            }

            .hl {
                padding: 8px 12px
            }
        }

        /* ===== Production Performance page ===== */
        .fbw {
            position: sticky;
            top: 0;
            z-index: 40;
            background: #f1f5fb;
            margin: 0 -22px;
            padding: 10px 22px 8px
        }

        .fb {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 9px 10px;
            border-radius: 18px;
            border: 1px solid #dbe4f2;
            white-space: nowrap;
            overflow-x: auto;
            scrollbar-width: thin;
            background: radial-gradient(150px 46px at 0% 100%, rgba(15, 42, 90, .14), transparent), radial-gradient(190px 54px at 100% 0%, rgba(224, 178, 74, .28), transparent), linear-gradient(180deg, #fff, #f5f9ff);
            box-shadow: 0 6px 18px rgba(16, 44, 92, .10), inset 0 0 0 1px rgba(255, 255, 255, .9)
        }

        .fp {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: none;
            border: 1px solid #e3eaf6;
            background: #fff;
            border-radius: 999px;
            padding: 6px 10px;
            font: 600 12px Inter, sans-serif;
            color: var(--navy);
            cursor: pointer;
            box-shadow: 0 1px 3px rgba(16, 44, 92, .08);
            transition: .15s
        }

        .fp:hover {
            border-color: #b9c9e6
        }

        .fp svg {
            width: 15px;
            height: 15px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.9;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex: none
        }

        .fp .fl {
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .fp svg.cv {
            width: 9px;
            height: 9px;
            opacity: .7
        }

        .fp.on {
            background: var(--navy);
            color: #fff;
            border-color: var(--navy)
        }

        .fp.dis {
            opacity: .45;
            cursor: not-allowed
        }

        .fp .ct {
            background: var(--red);
            color: #fff;
            border-radius: 99px;
            font-size: 10px;
            padding: 1px 6px;
            line-height: 1.4
        }

        .fd {
            display: flex;
            align-items: center;
            gap: 5px;
            flex: none;
            font: 700 11.5px Inter, sans-serif;
            color: var(--mute)
        }

        .fd input {
            border: 1px solid #e3eaf6;
            border-radius: 999px;
            padding: 5px 8px;
            font: 600 12px Inter, sans-serif;
            color: var(--navy);
            width: 124px;
            background: #fff
        }

        .fsep {
            width: 1px;
            height: 24px;
            background: #cfd9ec;
            flex: none;
            margin: 0 2px
        }

        .rs {
            margin-left: auto;
            flex: none;
            background: var(--navy);
            color: #fff;
            border: 2px solid var(--gold);
            border-radius: 999px;
            padding: 6px 16px;
            font: 700 13px Inter, sans-serif;
            cursor: pointer;
            display: flex;
            gap: 6px;
            align-items: center
        }

        .rs svg {
            width: 15px;
            height: 15px;
            stroke: #fff;
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .pop {
            position: fixed;
            z-index: 200;
            width: 230px;
            background: #fff;
            border-radius: 14px;
            border: 1px solid #dbe4f2;
            box-shadow: 0 16px 38px rgba(16, 44, 92, .28);
            display: none;
            flex-direction: column;
            overflow: hidden
        }

        .pop.on {
            display: flex
        }

        .pop input {
            margin: 10px 10px 6px;
            border: 1px solid #dbe4f2;
            border-radius: 9px;
            padding: 7px 9px;
            font: 500 12.5px Inter, sans-serif;
            color: var(--navy);
            outline: none
        }

        .pop .ls {
            max-height: 250px;
            overflow: auto;
            padding: 2px 6px
        }

        .pop label {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12.5px
        }

        .pop label:hover {
            background: #f1f5fc
        }

        .pop label input {
            margin: 0;
            width: 15px;
            height: 15px;
            accent-color: var(--navy)
        }

        .pop .ft {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            border-top: 1px solid #eef2f9;
            font-size: 12px;
            font-weight: 700
        }

        .pop .ft a {
            cursor: pointer;
            color: #12408f
        }

        .pop .nt {
            padding: 6px 12px;
            color: var(--mute);
            font-size: 11.5px
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            margin-top: 14px;
            align-items: stretch
        }

        @media(max-width:1100px) {
            .cards {
                grid-template-columns: 1fr
            }
        }

        .cd {
            background: #fff;
            border-radius: 20px;
            border: 1px solid #dbe4f2;
            box-shadow: 0 8px 24px rgba(16, 44, 92, .10);
            overflow: hidden;
            min-width: 0;
            display: flex;
            flex-direction: column
        }

        .cd .ch {
            min-height: 84px;
            position: relative;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px 12px;
            padding: 12px 14px 12px 16px;
            overflow: hidden
        }

        .cd.lt .ch {
            background: linear-gradient(180deg, #fff, #f7faff)
        }

        .cd.dk .ch {
            background: linear-gradient(100deg, #0a2a70, #0b3d94);
            color: #fff
        }

        .cd .ch::after {
            content: "";
            position: absolute;
            left: -46px;
            top: -52px;
            width: 150px;
            height: 104px;
            border-bottom: 3px solid var(--gold);
            border-radius: 0 0 100% 0;
            opacity: .85;
            pointer-events: none
        }

        .cd .ic {
            position: relative;
            z-index: 1;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            flex: none;
            background: linear-gradient(135deg, #0f2a5a, #17479a);
            color: #fff
        }

        .cd.dk .lg {
            color: #cfe0ff
        }

        .cd.dk .lg i {
            border-top-color: #fff
        }

        .cd.dk .ic {
            background: rgba(255, 255, 255, .12)
        }

        .cd .ic svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .cd .tt {
            position: relative;
            z-index: 1;
            flex: 1 1 180px;
            min-width: 0;
            border-left: 1px solid rgba(110, 130, 170, .45);
            padding-left: 12px
        }

        .cd .tt h3 {
            margin: 0;
            font-size: 19px;
            font-weight: 800;
            line-height: 1.15
        }

        .cd .tt p {
            margin: 3px 0 0;
            font-size: 11.5px;
            font-style: italic;
            opacity: .8
        }

        .lg {
            display: flex;
            gap: 10px;
            font-size: 10.5px;
            font-weight: 600;
            color: var(--mute);
            align-items: center;
            position: relative;
            z-index: 1
        }

        .lg i {
            display: inline-block;
            width: 22px;
            border-top: 2px solid var(--navy);
            vertical-align: middle;
            margin-right: 4px
        }

        .lg i.d {
            border-top-style: dashed
        }

        .tg {
            display: flex;
            gap: 6px;
            position: relative;
            z-index: 1
        }

        .tg button {
            display: flex;
            align-items: center;
            gap: 5px;
            border: 1px solid #d3def2;
            background: #fff;
            color: var(--navy);
            border-radius: 999px;
            padding: 6px 11px;
            font: 700 12px Inter, sans-serif;
            cursor: pointer;
            box-shadow: 0 1px 3px rgba(16, 44, 92, .10)
        }

        .tg button svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .tg button.on {
            background: var(--navy);
            color: #fff;
            border-color: var(--navy);
            box-shadow: 0 0 0 2px rgba(224, 178, 74, .55)
        }

        .kps {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
            padding: 12px 14px 4px
        }

        .kp {
            container-type: inline-size;
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(180deg, #fff, #f4f8ff);
            border: 1px solid #dbe4f2;
            border-radius: 16px;
            padding: 10px 12px 10px 10px;
            min-width: 0;
            overflow: hidden
        }

        .kp::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            width: 40px;
            height: 18px;
            background: linear-gradient(135deg, #f6cf6a, #c08a1e);
            border-radius: 0 100% 0 14px;
            opacity: .9
        }

        .kp.best {
            background: linear-gradient(180deg, #f2fcf4, #e2f6e8);
            border-color: #bfe6c9
        }

        .kp .bd {
            position: absolute;
            right: 0;
            top: 0;
            background: linear-gradient(135deg, #f6cf6a, #d9a02a);
            color: #3b2a00;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 10px 2px 14px;
            border-radius: 0 0 0 12px
        }

        @container (max-width: 175px) {
            .kp .ki {
                display: none
            }

            .kp .kb {
                border-left: 0;
                padding-left: 6px
            }
        }

        .kp .ki {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0f2a5a, #17479a);
            display: grid;
            place-items: center;
            flex: none;
            color: #fff;
            position: relative;
            z-index: 1
        }

        .kp .ki svg {
            width: 21px;
            height: 21px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .kp .kb {
            border-left: 1px solid #cfd9ec;
            padding-left: 10px;
            min-width: 0;
            position: relative;
            z-index: 1
        }

        .kp .kl {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .02em;
            text-transform: uppercase;
            line-height: 1.2
        }

        .kp .kv {
            font-size: clamp(14px, 8.4cqw, 26px);
            font-weight: 800;
            line-height: 1.15;
            white-space: nowrap;
            font-variant-numeric: tabular-nums
        }

        .kp.best .kv {
            color: #1f8f3a
        }

        .kp .ks {
            font-size: 10.5px;
            font-weight: 600;
            color: #42557d;
            line-height: 1.25
        }

        .kp .ks small {
            font-weight: 600;
            color: #42557d
        }

        .chip {
            display: inline-block;
            margin-top: 2px;
            padding: 2px 9px;
            border-radius: 999px;
            font-size: 10.5px;
            font-weight: 800
        }

        .chip.up {
            background: #d7f3de;
            color: #17783a
        }

        .chip.dn {
            background: #fde1e3;
            color: #b3261e
        }

        .cvw {
            padding: 4px 12px 8px;
            flex: 1;
            display: flex;
            align-items: center
        }

        .cvw svg {
            width: 100%;
            height: auto;
            display: block;
            font-family: Inter, sans-serif
        }

        .cft {
            display: flex;
            justify-content: center;
            padding: 0 12px 14px
        }

        .cft span {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #fff;
            border: 1px solid #dbe4f2;
            border-radius: 999px;
            padding: 6px 16px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(16, 44, 92, .10)
        }

        .cft svg {
            width: 17px;
            height: 17px;
            stroke: #c08a1e;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        /* filter bar: জায়গা কম হলে ধাপে ধাপে ছোট হয় (JS fitBar) */
        .fb.t1 {
            gap: 4px
        }

        .fb.t1 .fp {
            padding: 6px 8px;
            gap: 5px;
            font-size: 11.5px
        }

        .fb.t1 .fd input {
            width: 108px;
            font-size: 11.5px;
            padding: 5px 6px
        }

        .fb.t2 .fp svg:not(.cv) {
            display: none
        }

        .fb.t2 .fd {
            gap: 3px;
            font-size: 11px
        }

        .bl {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 12px;
            padding: 0 16px 4px;
            font-size: 11px;
            font-weight: 600
        }

        .bl i {
            display: inline-block;
            width: 11px;
            height: 11px;
            border-radius: 3px;
            vertical-align: -1px;
            margin-right: 4px
        }


        /* ===== Shift / Category Contribution cards ===== */
        .cd.sc .tt h3 b {
            color: #ffd23f
        }

        .cd.sc .tt h3 {
            font-size: 17px
        }

        .cd.sc .ch {
            min-height: 72px
        }

        .scb {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            padding: 12px 12px 8px
        }

        .scl {
            flex: 1 1 190px;
            background: linear-gradient(180deg, #fff, #eef4ff);
            border: 1px solid #e3eaf6;
            border-radius: 16px;
            padding: 10px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center
        }

        .scl svg {
            width: 100%;
            max-width: 210px;
            height: auto;
            font-family: Inter, sans-serif
        }

        .scg {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 3px;
            margin-top: 6px;
            font-size: 11.5px;
            font-weight: 800;
            color: var(--navy)
        }

        .scg i {
            display: inline-block;
            width: 11px;
            height: 11px;
            border-radius: 3px;
            margin-right: 6px;
            vertical-align: -1px
        }

        .scg span span {
            color: var(--mute);
            font-weight: 600
        }

        .scr {
            flex: 2.4 1 330px;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
            background: linear-gradient(180deg, #f7faff, #eef4ff);

                var foot = '<td class="f f1" colspan="3">Total</td>' + T.tot.map(function (v, j) { return v > 0 ? '<td' + (j === nc - 1 ? ' class="gt"' : "") + '>' + fn(v) + '</td>' : '<td class="z' + (j === nc - 1 ? ' gt' : "") + '">–</td>' }).join("");
                var cap = T.nd === 1 ? "Single day · values are the day total (sum)" : "Daily average across " + T.nd + " days (month / year / range)";
                return '<section class="mpt" id="mpt"><div class="mpt-hd"><div><h3>M/C wise Manpower Detail</h3><p>' + cap + ' · sorted by Total</p></div><div class="mpt-ct"><span class="mpt-inf">' + (T.list.length ? (a + 1) + '–' + b + ' of ' + T.list.length + ' M/C rows' : "0 rows") + '</span><button type="button" data-a="prev"' + (TBP <= 0 ? " disabled" : "") + '>‹ Prev</button><button type="button" data-a="next"' + (TBP >= pages - 1 ? " disabled" : "") + '>Next ›</button><button type="button" class="dx" data-a="xl">⬇ Download Excel</button></div></div>' +
                    (T.list.length ? '<div class="mpt-sc"><table class="mpt-t"><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody><tfoot><tr>' + foot + '</tr></tfoot></table></div>' : '<div class="mp-no">No data for the selected filters</div>') + '</section>'
            }
            function safeTbl() { try { TB = tblCalc(); TBP = 0; return tblHTML() } catch (e) { console.error(e); return "" } }
            function tblRefresh() { var el = $m("#mpt"); if (!el || !TB) return; var t = document.createElement("div"); t.innerHTML = tblHTML(); el.replaceWith(t.firstChild); bindTbl(); var sc = $m("#mpt .mpt-sc"); if (sc) sc.scrollTop = 0 }
            function tblXL() {
                if (!TB || !TB.list.length) return alert("Nothing to download.");
                var go = function () {
                    var r2 = function (x) { return Math.round(x * 100) / 100 }, rows = TB.list.map(function (o) { var r = { "M/C NO.": o.mc, "Model": o.md, "Tool": o.tl }; TB.labels.forEach(function (l, j) { r[l] = r2(o.v[j]) }); return r });
                    var t = { "M/C NO.": "Total", "Model": "", "Tool": "" }; TB.labels.forEach(function (l, j) { t[l] = r2(TB.tot[j]) }); rows.push(t);
                    var w = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(w, XLSX.utils.json_to_sheet(rows), "Manpower Detail"); XLSX.writeFile(w, "Manpower_MC_Detail_" + new Date().toISOString().slice(0, 10) + ".xlsx")
                };
                if (window.XLSX) return go();
                var s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; s.onload = go; s.onerror = function () { alert("Could not load the Excel library") }; document.head.appendChild(s)
            }
            function bindTbl() {
                var el = $m("#mpt"); if (!el) return;
                el.onclick = function (e) {
                    var h = e.target.closest ? e.target.closest("th[data-s]") : null;
                    if (h) {
                        var k = h.dataset.s; k = /^\d+$/.test(k) ? +k : k;
                        if (TBS.k !== k) { TBS.k = k; TBS.d = 1 } else if (TBS.d === 1) TBS.d = -1; else { TBS.k = null; TBS.d = 1 }
                        var np = NP.length; tblApplySort(TB.list, np); TBP = 0; tblRefresh(); return
                    }
                    var b = e.target.closest ? e.target.closest("button[data-a]") : null; if (!b || b.disabled) return; var a = b.dataset.a; if (a === "prev") { TBP--; tblRefresh() } else if (a === "next") { TBP++; tblRefresh() } else if (a === "xl") tblXL()
                }
            }

            /* ---------- Bay hover tooltip (Process-wise) · process click → M/C No · Model · Tool ---------- */
            var BT = { el: null, bay: null, hide: 0, md: null };
            function bayInfo(b) {
                if (!LAST || !LAST.bayP || !LAST.bayP[b]) return null;
                var o = LAST.bayP[b], items = NP.map(function (p, j) { return { l: p[1], v: o.proc[j], j: j } }).filter(function (x) { return x.v > 0 }).sort(function (a, b2) { return b2.v - a.v });
                return { o: o, items: items, tot: items.reduce(function (a, x) { return a + x.v }, 0) }
            }
            function btEl() {
                if (BT.el) return BT.el;
                var d = document.createElement("div"); d.className = "bt"; document.body.appendChild(d); BT.el = d;
                d.addEventListener("mouseenter", function () { clearTimeout(BT.hide) });
                d.addEventListener("mouseleave", btHideSoon);
                d.addEventListener("click", function (e) { var k = e.target.closest ? e.target.closest(".pk") : null; if (k) { btHideNow(); mdOpen(BT.bay, +k.dataset.j) } });
                return d
            }
            function btHideSoon() { clearTimeout(BT.hide); BT.hide = setTimeout(btHideNow, 260) }
            function btHideNow() { clearTimeout(BT.hide); if (BT.el) BT.el.classList.remove("on") }
            function btShow(row) {
                var b = row.dataset.b, info = bayInfo(b); if (!info) return;
                clearTimeout(BT.hide); if (BT.bay === b && BT.el && BT.el.classList.contains("on")) return; BT.bay = b; var el = btEl();
                el.innerHTML = '<div class="bth"><span>' + E(b) + ' · Process-wise Manpower</span><b>' + fn(info.tot) + '</b></div><div class="btb">' + procBars(LAST, info) + '</div><div class="btf">Click a process bar → M/C No · Model · Tool</div>';
                el.classList.add("on");
                var r = row.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight, vw = window.innerWidth, vh = window.innerHeight;
                var x = r.right + 12; if (x + w > vw - 8) x = Math.max(8, r.left - w - 12); if (x < 8) x = Math.max(8, Math.min(vw - w - 8, r.left));
                var y = r.top + r.height / 2 - h / 2; y = Math.max(8, Math.min(vh - h - 8, y));
                el.style.left = x + "px"; el.style.top = y + "px"
            }
            function mdClose() { if (BT.md) { BT.md.remove(); BT.md = null } }
            /* popup state: lvl "bay" (Process click → Bay list) | "mc" (Bay click → M/C No · Model · Tool) ; header click = A→Z / Z→A / default */
            function mdOpen(b, j, fromBays) { var info = bayInfo(b); if (!info) return; mdClose(); BT.st = { lvl: "mc", b: b, j: j, k: null, d: 1, back: !!fromBays }; mdDraw(true) }
            function mdBays(j) { mdClose(); BT.st = { lvl: "bay", j: j, k: null, d: 1 }; mdDraw(true) }
            function mdSort(list, st, dk, tk) {
                var k = st.k, d = st.d;
                if (k === null) { list.sort(function (a, c) { return (c[dk] - a[dk]) || nz(a[tk], c[tk]) }); return }
                list.sort(function (a, c) { var r = (k === dk) ? (a[dk] - c[dk]) : nz(a[k], c[k]); return (r * d) || nz(a[tk], c[tk]) })
            }
            function mdDraw(first) {
                var st = BT.st, j = st.j, pn = NP[j][1], R = LAST, ar = function (k) { return '<span class="srt">' + (st.k === k ? (st.d === 1 ? "▲" : "▼") : "↕") + '</span>' };
                var th = function (k, t, l) { return '<th class="sh' + (l ? " l" : "") + '" data-s="' + k + '" title="Click to sort"' + (st.k === k ? ' aria-sort="' + (st.d === 1 ? "ascending" : "descending") + '"' : "") + '>' + t + ' ' + ar(k) + '</th>' };
                var title, sub, table, per = R.days === 1 ? "single day (sum)" : "daily average across " + R.days + " days";
                if (st.lvl === "bay") {
                    var rows = Object.keys(R.bayP).map(function (b) { return { b: b, v: R.bayP[b].proc[j] } }).filter(function (x) { return x.v > 0 });
                    mdSort(rows, st, "v", "b");
                    var mx = rows.reduce(function (m, x) { return Math.max(m, x.v) }, 0), tot = rows.reduce(function (a, x) { return a + x.v }, 0);
                    title = E(pn) + ' · Bay wise'; sub = 'Click a Bay → M/C No · Model · Tool · ' + per;
                    table = rows.length ? '<div class="mds"><table class="mdt"><thead><tr>' + th("b", "Bay", 1) + th("v", E(pn)) + '</tr></thead><tbody>' + rows.map(function (x) { return '<tr class="rk" data-b="' + E(x.b) + '"><td class="l">' + E(x.b) + '</td><td class="b" style="--w:' + (mx ? Math.max(3, x.v / mx * 100) : 0).toFixed(1) + '%">' + fn(x.v) + '</td></tr>' }).join("") + '</tbody><tfoot><tr><td class="l">Total (' + rows.length + ' Bay)</td><td>' + fn(tot) + '</td></tr></tfoot></table></div>' : '<div class="mp-no">No bay data for this process</div>'
                } else {
                    var info = bayInfo(st.b), rows2 = Array.from(info.o.mc.values()).filter(function (m) { return m.v[j] > 0 }).map(function (m) { return { mc: m.mc, md: m.md, tl: m.tl, v: m.v[j] } });
                    mdSort(rows2, st, "v", "mc");
                    var mx2 = rows2.reduce(function (m, x) { return Math.max(m, x.v) }, 0), tot2 = rows2.reduce(function (a, x) { return a + x.v }, 0);
                    title = (st.back ? '<button type="button" class="mdbk">← Bays</button>' : "") + E(st.b) + ' · ' + E(pn); sub = 'M/C wise manpower · ' + per;
                    table = rows2.length ? '<div class="mds"><table class="mdt"><thead><tr>' + th("mc", "M/C NO.", 1) + th("md", "Model", 1) + th("tl", "Tool", 1) + th("v", E(pn)) + '</tr></thead><tbody>' + rows2.map(function (m) { return '<tr><td class="l">' + E(m.mc) + '</td><td class="l">' + E(m.md) + '</td><td class="l">' + E(m.tl) + '</td><td class="b" style="--w:' + (mx2 ? Math.max(3, m.v / mx2 * 100) : 0).toFixed(1) + '%">' + fn(m.v) + '</td></tr>' }).join("") + '</tbody><tfoot><tr><td class="l" colspan="3">Total (' + rows2.length + ' M/C)</td><td>' + fn(tot2) + '</td></tr></tfoot></table></div>' : '<div class="mp-no">No M/C data for this process</div>'
                }
                var html = '<div class="mdc" role="dialog"><div class="mdh"><div><h3>' + title + '</h3><p>' + sub + '</p></div><button type="button" class="mdx" aria-label="Close">✕</button></div>' + table + '</div>';
                if (first) {
                    var d = document.createElement("div"); d.className = "mdw"; d.innerHTML = html;
                    d.addEventListener("click", function (e) {
                        var t = e.target; if (!t.closest) return;
                        if (t === d || t.closest(".mdx")) return mdClose();
                        if (t.closest(".mdbk")) { var jj = BT.st.j; BT.st = { lvl: "bay", j: jj, k: null, d: 1 }; return mdDraw() }
                        var h = t.closest("th[data-s]");
                        if (h) { var k = h.dataset.s; if (BT.st.k !== k) { BT.st.k = k; BT.st.d = 1 } else if (BT.st.d === 1) BT.st.d = -1; else { BT.st.k = null; BT.st.d = 1 } return mdDraw() }
                        var r = t.closest("tr.rk"); if (r && BT.st.lvl === "bay") { var jj2 = BT.st.j; BT.st = { lvl: "mc", b: r.dataset.b, j: jj2, k: null, d: 1, back: true }; mdDraw() }
                    });
                    document.body.appendChild(d); BT.md = d
                } else if (BT.md) BT.md.innerHTML = html
            }
            if (!window.__manBayTip) {
                window.__manBayTip = 1;
                document.addEventListener("mouseover", function (e) { var r = e.target.closest ? e.target.closest(".mp-hb .r[data-b]") : null; if (r) btShow(r) });
                document.addEventListener("mouseout", function (e) { var r = e.target.closest ? e.target.closest(".mp-hb .r[data-b]") : null; if (r && !(e.relatedTarget && r.contains(e.relatedTarget))) btHideSoon() });
                document.addEventListener("click", function (e) { var pm = e.target.closest ? e.target.closest("rect.pm") : null; if (pm) { btHideNow(); return mdBays(+pm.dataset.j) } var r = e.target.closest ? e.target.closest(".mp-hb .r[data-b]") : null; if (r) btShow(r) });
                document.addEventListener("keydown", function (e) { if (e.key === "Escape") { mdClose(); btHideNow() } });
            }

            /* ---------- page ---------- */
            function bannerHTML() {
                return '<div class="mp-top"><div class="mp-ti">' + SVG(IC.users) + '</div><h2>Manpower Analytics Dashboard</h2><div class="mp-sp"></div><div class="mp-tg">' + SVG('<path d="M4 20V12M10 20V8M16 20v-5M3 20h18M13 6l4-3 4 2"/>') + '<span>Drive Efficiency<br>Grow Together</span></div></div>'
            }
            async function showMan() {
                var c = $m("#pgc"); if (!c) return;
                c.innerHTML = '<div class="ld">Loading data…</div>';
                await findSub(); if (CUR !== "man") return;
                if (!MSUB) { c.innerHTML = msg("Manpower Performance data source not found", "Create the “Manpower Performance” sub-module under Production &amp; Planning in Admin Console."); return }
                await loadMP(); if (CUR !== "man") return;
                if (!MP) {
                    c.innerHTML = MERR === "err" ? msg("Could not load data", "Check your connection or your access to Manpower Performance, then reload.")
                        : MERR === "old" ? msg("Manpower file needs to be uploaded again", "The stored data uses an older format. Upload the new Manpower Excel in Admin Console → Data Manager → Production &amp; Planning → Manpower Performance.")
                            : msg("No data connected yet", "Upload the Manpower Excel/CSV in Admin Console → Data Manager → Production &amp; Planning → Manpower Performance.");
                    return
                }
                c.innerHTML = bannerHTML() + filterHTML() + '<div id="mpb"></div>'; bindFilters(); renderBody()
            }
            var _show = window.show;
            window.show = function (p) { var r = _show.apply(this, arguments); if (p === "man") showMan().catch(function (e) { console.error(e) }); return r };
        })();
    </script>
    <script id="router-js">
        /* shopfloor.html = hub. OEE → shopfloor-oee.html, Production → shopfloor-production.html.
           Manpower / Material / Machine Overview এই ফাইলেই থাকে, তাই এই ফাইলটি মুছবেন না। */
        (function () {
            const TO = { oee: "shopfloor-oee.html", prod: "shopfloor-production.html" };
            const go = p => { if (TO[p]) { location.replace(TO[p] + location.search); return true } return false };
            const boot = () => { if (go(location.hash.slice(1))) return; const orig = window.show;
                if (typeof orig === "function") window.show = function (p) { return go(p) ? undefined : orig.apply(this, arguments) } };
            if (document.readyState === "loading") addEventListener("DOMContentLoaded", boot); else boot();
        })();
    </script>
