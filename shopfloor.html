<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Mainetti · Production-Shop floor</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0f2a5a;
            --red: #a61935;
            --mute: #6d7c99;
            --line: #dbe4f2;
            --gold: #e0b24a
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: Inter, system-ui, sans-serif;
            color: var(--navy);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #f1f5fb;
            font-size: 13px
        }

        /* ===== header ===== */
        header {
            flex: none;
            position: relative;
            z-index: 60;
            display: flex;
            align-items: stretch;
            height: clamp(66px, 9vh, 88px);
            background: linear-gradient(90deg, #f8fbff, #e8f0fc);
            box-shadow: 0 4px 18px rgba(16, 44, 92, .12)
        }

        .hl {
            display: flex;
            align-items: center;
            gap: clamp(12px, 1.5vw, 24px);
            padding: 0 clamp(14px, 1.8vw, 30px);
            position: relative;
            z-index: 2;
            flex: none
        }

        .hl img {
            height: clamp(40px, 6.2vh, 58px);
            display: block
        }

        .logo {
            font-weight: 800;
            letter-spacing: .06em;
            font-size: 20px;
            line-height: 1;
            color: var(--navy)
        }

        .logo small {
            display: block;
            font-size: 9px;
            letter-spacing: .2em;
            margin-top: 3px;
            color: #12408f
        }

        .sep {
            width: 1px;
            height: 46px;
            background: #9fb3d3;
            flex: none
        }

        .tag {
            font-style: italic;
            font-weight: 600;
            color: #12408f;
            font-size: clamp(12px, 1.15vw, 18px);
            white-space: nowrap
        }

        .tag i {
            font-style: normal;
            margin: 0 .7em;
            opacity: .55
        }

        .gr {
            font-size: 11.5px;
            color: var(--mute);
            margin-top: 3px;
            white-space: nowrap
        }

        .hp {
            flex: 1;
            min-width: 0;
            position: relative;
            overflow: hidden
        }

        .hp::before {
            content: "";
            position: absolute;
            inset: 0;
            background: url(assets/header-photo.jpg) right center/cover no-repeat;
            -webkit-mask-image: linear-gradient(90deg, transparent, #000 40%);
            mask-image: linear-gradient(90deg, transparent, #000 40%)
        }

        .hr {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: clamp(10px, 1.2vw, 18px);
            padding: 0 clamp(14px, 1.6vw, 26px) 0 clamp(54px, 5vw, 84px);
            color: #fff;
            flex: none
        }

        .hr::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(100deg, #0a2a70, #0b3d94);
            clip-path: polygon(44px 0, 100% 0, 100% 100%, 0 100%);
            z-index: -1
        }

        .hr svg.fy {
            width: clamp(30px, 2.6vw, 42px);
            height: clamp(30px, 2.6vw, 42px);
            flex: none
        }

        .ht b {
            display: block;
            font-size: clamp(15px, 1.5vw, 23px);
            font-weight: 800;
            white-space: nowrap
        }

        .ht span {
            display: block;
            font-size: clamp(9.5px, .8vw, 12px);
            opacity: .92;
            margin-top: 2px;
            white-space: nowrap
        }

        .user {
            position: relative
        }

        .ub {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, .14);
            border: 1px solid rgba(255, 255, 255, .4);
            color: #fff;
            border-radius: 999px;
            padding: 4px 14px 4px 4px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit
        }

        .av {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #fff;
            color: #0b3d94;
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: 12px
        }

        .menu {
            position: absolute;
            right: 0;
            top: 46px;
            background: #fff;
            color: var(--navy);
            border-radius: 12px;
            box-shadow: 0 14px 34px rgba(16, 44, 92, .25);
            min-width: 170px;
            display: none;
            overflow: hidden;
            z-index: 30
        }

        .menu div {
            padding: 12px 16px;
            cursor: pointer;
            font-weight: 600
        }

        .menu div:hover {
            background: #f1f5fc
        }

        /* ===== layout ===== */
        .bk {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 1px solid #9fb3d3;
            background: #fff;
            color: var(--navy);
            font-size: 18px;
            cursor: pointer;
            flex: none
        }

        .lay {
            flex: 1;
            min-height: 0;
            display: flex
        }

        aside {
            flex: none;
            width: 250px;
            background: #fff;
            border-right: 1px solid var(--line);
            padding: 10px 0;
            transition: .2s;
            overflow: hidden
        }

        aside.col {
            width: 62px
        }

        .nv {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 20px;
            cursor: pointer;
            font-weight: 600;
            color: #3a4d73;
            border-left: 3px solid transparent
        }

        .nv span {
            line-height: 1.25
        }

        aside.col .nv span {
            white-space: nowrap
        }

        .nv svg {
            width: 20px;
            height: 20px;
            flex: none;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.9;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .nv:hover {
            background: #f5f8fd
        }

        .nv.on {
            color: var(--red);
            background: #fdeff2;
            border-left-color: var(--red)
        }

        .nv.t {
            color: var(--mute);
            margin-bottom: 6px
        }

        main {
            flex: 1;
            min-width: 0;
            overflow: auto;
            padding: 0 22px 30px
        }

        .ttl {
            font-size: 20px;
            font-weight: 800;
            margin: 18px 0 2px
        }

        .sub {
            color: var(--mute);
            margin: 0 0 14px
        }

        .empty {
            background: #fff;
            border-radius: 16px;
            padding: 60px 20px;
            text-align: center;
            color: var(--mute)
        }

        .empty b {
            display: block;
            color: var(--navy);
            font-size: 17px;
            margin-bottom: 6px
        }

        @media(max-width:900px) {
            body {
                height: 100dvh;
                overflow: hidden
            }

            aside {
                width: 62px
            }

            .nv span {
                display: none
            }

            .hl {
                padding: 8px 12px
            }
        }

        /* ===== Production Performance page ===== */
        .fbw {
            position: sticky;
            top: 0;
            z-index: 40;
            background: #f1f5fb;
            margin: 0 -22px;
            padding: 10px 22px 8px
        }

        .fb {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 9px 10px;
            border-radius: 18px;
            border: 1px solid #dbe4f2;
            white-space: nowrap;
            overflow-x: auto;
            scrollbar-width: thin;
            background: radial-gradient(150px 46px at 0% 100%, rgba(15, 42, 90, .14), transparent), radial-gradient(190px 54px at 100% 0%, rgba(224, 178, 74, .28), transparent), linear-gradient(180deg, #fff, #f5f9ff);
            box-shadow: 0 6px 18px rgba(16, 44, 92, .10), inset 0 0 0 1px rgba(255, 255, 255, .9)
        }

        .fp {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: none;
            border: 1px solid #e3eaf6;
            background: #fff;
            border-radius: 999px;
            padding: 6px 10px;
            font: 600 12px Inter, sans-serif;
            color: var(--navy);
            cursor: pointer;
            box-shadow: 0 1px 3px rgba(16, 44, 92, .08);
            transition: .15s
        }

        .fp:hover {
            border-color: #b9c9e6
        }

        .fp svg {
            width: 15px;
            height: 15px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.9;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex: none
        }

        .fp .fl {
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .fp svg.cv {
            width: 9px;
            height: 9px;
            opacity: .7
        }

        .fp.on {
            background: var(--navy);
            color: #fff;
            border-color: var(--navy)
        }

        .fp.dis {
            opacity: .45;
            cursor: not-allowed
        }

        .fp .ct {
            background: var(--red);
            color: #fff;
            border-radius: 99px;
            font-size: 10px;
            padding: 1px 6px;
            line-height: 1.4
        }

        .fd {
            display: flex;
            align-items: center;
            gap: 5px;
            flex: none;
            font: 700 11.5px Inter, sans-serif;
            color: var(--mute)
        }

        .fd input {
            border: 1px solid #e3eaf6;
            border-radius: 999px;
            padding: 5px 8px;
            font: 600 12px Inter, sans-serif;
            color: var(--navy);
            width: 124px;
            background: #fff
        }

        .fsep {
            width: 1px;
            height: 24px;
            background: #cfd9ec;
            flex: none;
            margin: 0 2px
        }

        .rs {
            margin-left: auto;
            flex: none;
            background: var(--navy);
            color: #fff;
            border: 2px solid var(--gold);
            border-radius: 999px;
            padding: 6px 16px;
            font: 700 13px Inter, sans-serif;
            cursor: pointer;
            display: flex;
            gap: 6px;
            align-items: center
        }

        .rs svg {
            width: 15px;
            height: 15px;
            stroke: #fff;
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .pop {
            position: fixed;
            z-index: 200;
            width: 230px;
            background: #fff;
            border-radius: 14px;
            border: 1px solid #dbe4f2;
            box-shadow: 0 16px 38px rgba(16, 44, 92, .28);
            display: none;
            flex-direction: column;
            overflow: hidden
        }

        .pop.on {
            display: flex
        }

        .pop input {
            margin: 10px 10px 6px;
            border: 1px solid #dbe4f2;
            border-radius: 9px;
            padding: 7px 9px;
            font: 500 12.5px Inter, sans-serif;
            color: var(--navy);
            outline: none
        }

        .pop .ls {
            max-height: 250px;
            overflow: auto;
            padding: 2px 6px
        }

        .pop label {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12.5px
        }

        .pop label:hover {
            background: #f1f5fc
        }

        .pop label input {
            margin: 0;
            width: 15px;
            height: 15px;
            accent-color: var(--navy)
        }

        .pop .ft {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            border-top: 1px solid #eef2f9;
            font-size: 12px;
            font-weight: 700
        }

        .pop .ft a {
            cursor: pointer;
            color: #12408f
        }

        .pop .nt {
            padding: 6px 12px;
            color: var(--mute);
            font-size: 11.5px
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            margin-top: 14px;
            align-items: stretch
        }

        @media(max-width:1100px) {
            .cards {
                grid-template-columns: 1fr
            }
        }

        .cd {
            background: #fff;
            border-radius: 20px;
            border: 1px solid #dbe4f2;
            box-shadow: 0 8px 24px rgba(16, 44, 92, .10);
            overflow: hidden;
            min-width: 0;
            display: flex;
            flex-direction: column
        }

        .cd .ch {
            min-height: 84px;
            position: relative;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px 12px;
            padding: 12px 14px 12px 16px;
            overflow: hidden
        }

        .cd.lt .ch {
            background: linear-gradient(180deg, #fff, #f7faff)
        }

        .cd.dk .ch {
            background: linear-gradient(100deg, #0a2a70, #0b3d94);
            color: #fff
        }

        .cd .ch::after {
            content: "";
            position: absolute;
            left: -46px;
            top: -52px;
            width: 150px;
            height: 104px;
            border-bottom: 3px solid var(--gold);
            border-radius: 0 0 100% 0;
            opacity: .85;
            pointer-events: none
        }

        .cd .ic {
            position: relative;
            z-index: 1;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            flex: none;
            background: linear-gradient(135deg, #0f2a5a, #17479a);
            color: #fff
        }

        .cd.dk .lg {
            color: #cfe0ff
        }

        .cd.dk .lg i {
            border-top-color: #fff
        }

        .cd.dk .ic {
            background: rgba(255, 255, 255, .12)
        }

        .cd .ic svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .cd .tt {
            position: relative;
            z-index: 1;
            flex: 1 1 180px;
            min-width: 0;
            border-left: 1px solid rgba(110, 130, 170, .45);
            padding-left: 12px
        }

        .cd .tt h3 {
            margin: 0;
            font-size: 19px;
            font-weight: 800;
            line-height: 1.15
        }

        .cd .tt p {
            margin: 3px 0 0;
            font-size: 11.5px;
            font-style: italic;
            opacity: .8
        }

        .lg {
            display: flex;
            gap: 10px;
            font-size: 10.5px;
            font-weight: 600;
            color: var(--mute);
            align-items: center;
            position: relative;
            z-index: 1
        }

        .lg i {
            display: inline-block;
            width: 22px;
            border-top: 2px solid var(--navy);
            vertical-align: middle;
            margin-right: 4px
        }

        .lg i.d {
            border-top-style: dashed
        }

        .tg {
            display: flex;
            gap: 6px;
            position: relative;
            z-index: 1
        }

        .tg button {
            display: flex;
            align-items: center;
            gap: 5px;
            border: 1px solid #d3def2;
            background: #fff;
            color: var(--navy);
            border-radius: 999px;
            padding: 6px 11px;
            font: 700 12px Inter, sans-serif;
            cursor: pointer;
            box-shadow: 0 1px 3px rgba(16, 44, 92, .10)
        }

        .tg button svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .tg button.on {
            background: var(--navy);
            color: #fff;
            border-color: var(--navy);
            box-shadow: 0 0 0 2px rgba(224, 178, 74, .55)
        }

        .kps {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
            padding: 12px 14px 4px
        }

        .kp {
            container-type: inline-size;
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(180deg, #fff, #f4f8ff);
            border: 1px solid #dbe4f2;
            border-radius: 16px;
            padding: 10px 12px 10px 10px;
            min-width: 0;
            overflow: hidden
        }

        .kp::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            width: 40px;
            height: 18px;
            background: linear-gradient(135deg, #f6cf6a, #c08a1e);
            border-radius: 0 100% 0 14px;
            opacity: .9
        }

        .kp.best {
            background: linear-gradient(180deg, #f2fcf4, #e2f6e8);
            border-color: #bfe6c9
        }

        .kp .bd {
            position: absolute;
            right: 0;
            top: 0;
            background: linear-gradient(135deg, #f6cf6a, #d9a02a);
            color: #3b2a00;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 10px 2px 14px;
            border-radius: 0 0 0 12px
        }

        @container (max-width: 175px) {
            .kp .ki {
                display: none
            }

            .kp .kb {
                border-left: 0;
                padding-left: 6px
            }
        }

        .kp .ki {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0f2a5a, #17479a);
            display: grid;
            place-items: center;
            flex: none;
            color: #fff;
            position: relative;
            z-index: 1
        }

        .kp .ki svg {
            width: 21px;
            height: 21px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .kp .kb {
            border-left: 1px solid #cfd9ec;
            padding-left: 10px;
            min-width: 0;
            position: relative;
            z-index: 1
        }

        .kp .kl {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .02em;
            text-transform: uppercase;
            line-height: 1.2
        }

        .kp .kv {
            font-size: clamp(14px, 8.4cqw, 26px);
            font-weight: 800;
            line-height: 1.15;
            white-space: nowrap;
            font-variant-numeric: tabular-nums
        }

        .kp.best .kv {
            color: #1f8f3a
        }

        .kp .ks {
            font-size: 10.5px;
            font-weight: 600;
            color: #42557d;
            line-height: 1.25
        }

        .kp .ks small {
            font-weight: 600;
            color: #42557d
        }

        .chip {
            display: inline-block;
            margin-top: 2px;
            padding: 2px 9px;
            border-radius: 999px;
            font-size: 10.5px;
            font-weight: 800
        }

        .chip.up {
            background: #d7f3de;
            color: #17783a
        }

        .chip.dn {
            background: #fde1e3;
            color: #b3261e
        }

        .cvw {
            padding: 4px 12px 8px;
            flex: 1;
            display: flex;
            align-items: center
        }

        .cvw svg {
            width: 100%;
            height: auto;
            display: block;
            font-family: Inter, sans-serif
        }

        .cft {
            display: flex;
            justify-content: center;
            padding: 0 12px 14px
        }

        .cft span {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #fff;
            border: 1px solid #dbe4f2;
            border-radius: 999px;
            padding: 6px 16px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(16, 44, 92, .10)
        }

        .cft svg {
            width: 17px;
            height: 17px;
            stroke: #c08a1e;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        /* filter bar: জায়গা কম হলে ধাপে ধাপে ছোট হয় (JS fitBar) */
        .fb.t1 {
            gap: 4px
        }

        .fb.t1 .fp {
            padding: 6px 8px;
            gap: 5px;
            font-size: 11.5px
        }

        .fb.t1 .fd input {
            width: 108px;
            font-size: 11.5px;
            padding: 5px 6px
        }

        .fb.t2 .fp svg:not(.cv) {
            display: none
        }

        .fb.t2 .fd {
            gap: 3px;
            font-size: 11px
        }

        .bl {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 12px;
            padding: 0 16px 4px;
            font-size: 11px;
            font-weight: 600
        }

        .bl i {
            display: inline-block;
            width: 11px;
            height: 11px;
            border-radius: 3px;
            vertical-align: -1px;
            margin-right: 4px
        }


        /* ===== Shift / Category Contribution cards ===== */
        .cd.sc .tt h3 b {
            color: #ffd23f
        }

        .cd.sc .tt h3 {
            font-size: 17px
        }

        .cd.sc .ch {
            min-height: 72px
        }

        .scb {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            padding: 12px 12px 8px
        }

        .scl {
            flex: 1 1 190px;
            background: linear-gradient(180deg, #fff, #eef4ff);
            border: 1px solid #e3eaf6;
            border-radius: 16px;
            padding: 10px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center
        }

        .scl svg {
            width: 100%;
            max-width: 210px;
            height: auto;
            font-family: Inter, sans-serif
        }

        .scg {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 3px;
            margin-top: 6px;
            font-size: 11.5px;
            font-weight: 800;
            color: var(--navy)
        }

        .scg i {
            display: inline-block;
            width: 11px;
            height: 11px;
            border-radius: 3px;
            margin-right: 6px;
            vertical-align: -1px
        }

        .scg span span {
            color: var(--mute);
            font-weight: 600
        }

        .scr {
            flex: 2.4 1 330px;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
            background: linear-gradient(180deg, #f7faff, #eef4ff);

            const bl = `<div class="scbl">${items.map((i, k) => `<span><i style="background:${col(k)}"></i>${esc(names[i] || "All")}</span>`).join("")}</div>`;
            return `<section class="cd dk sc">${head}<div class="scb"><div class="scl">${donut}${legend}</div><div class="scr">${colm(0, "MORNING", SUN)}${colm(1, "NIGHT", MOON)}${colm(2, "TOTAL", SIG)}</div></div>${bl}</section>`
        }
        const shiftCard = R => contribCard(R, { key: "sc", title: "Shift <b>Contribution</b> Analysis", sub: "Morning vs Night · bay-wise share inside each shift", arr: R.sb, n: R.nb, names: R.bayD, donut: "shift" });
        const catCard = R => contribCard(R, { key: "cc", title: "Category <b>Contribution</b> Analysis", sub: "Category share of total · split by Morning &amp; Night", arr: R.sct, n: R.ncat, names: R.catD, donut: "dim" });
        /* ---------- KPI cards (Finish Product · WIP · Good Production · Idle Machine) ---------- */
        ICO.idle = '<circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/>';
        const SUNW = '<svg viewBox="0 0 24 24" fill="none" stroke="#ffe08a" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="#ffd54a"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M18.7 5.3l-1.8 1.8M7.1 16.9l-1.8 1.8"/></svg>';
        const MOONW = '<svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="#fff"/></svg>';
        function lyChip(cur, ly, ok, inv) {
            if (!ok || !(ly > 0)) return `<span class="ly na">vs LY n/a</span>`;
            const p = (cur / ly - 1) * 100, up = p >= 0, good = inv ? !up : up;
            return `<span class="ly ${good ? "g" : "b"}">${up ? "▲" : "▼"} ${up ? "+" : ""}${p.toFixed(1)}% vs LY</span>`
        }
        function kpiHTML(R) {
            const nb = R.nb, defs = [["fg", "Finish Product", "fg", "k1"], ["wip", "WIP Product", "wip", "k2"], ["good", "Good Production", "good", "k3"]];
            const bays = []; for (let bi = 0; bi < nb; bi++) { let t = 0; for (let yi = 0; yi < R.ny; yi++) for (let q = 0; q < 3; q++) t += R.yb[(yi * nb + bi) * 3 + q]; if (t > 0) bays.push(bi) }
            bays.sort((x, y) => nat(R.bayD[x], R.bayD[y]));
            const cols = bays.length > 6 ? 3 : 2, dv = `<div class="kdiv">BAY-WISE</div>`;
            const chips = f => `<div class="kbay" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">${bays.map((bi, i) => f(bi, i)).join("") || '<span><span>No data</span></span>'}</div>`;
            const dot = i => `<i style="background:${PAL[i % PAL.length]}"></i>`;
            let h = defs.map(([k, label, icon, cls], mi) => {
                const tot = R.tot3[mi];
                return `<div class="kc ${cls}"><div class="kt"><div class="kic">${ic(icon)}</div><div class="kn">${label}</div></div><div class="kv2" data-tip="${fv(tot)}">${fc(tot)}</div><div class="ksub">${lyChip(tot, R.lyT[mi], R.lyOk)}</div>${dv}${chips((bi, i) => { let t = 0; for (let yi = 0; yi < R.ny; yi++) t += R.yb[(yi * nb + bi) * 3 + mi]; return `<span data-tip="${fc(t)}"><span>${dot(i)}${esc(R.bayD[bi] || "All")}</span><b>${fv(t)}</b></span>` })}</div>`
            }).join("");
            const I = R.idle, L = R.idleL, rd = Math.round;
            const lrr = (a, target) => { const f = a.map(Math.floor); let r = target - f.reduce((p, c) => p + c, 0); const ix = a.map((v, i) => [v - f[i], i]).sort((x, y) => y[0] - x[0]); for (let k = 0; r > 0 && k < ix.length; k++, r--) f[ix[k][1]]++; return f };
            let idleHTML;
            if (!I) idleHTML = `<div class="kc k4"><div class="kt"><div class="kic">${ic("idle")}</div><div class="kn">Idle Machine</div></div><div class="kv2">—</div><div class="ksub">No machine / shift data</div></div>`;
            else {
                const ib = []; for (let bi = 0; bi < nb; bi++) if (bays.includes(bi) || I.bm[bi] + I.bn[bi] > 0) ib.push(bi);
                ib.sort((x, y) => nat(R.bayD[x], R.bayD[y]));
                const tm = rd(I.m), tn = rd(I.n), vm = lrr(ib.map(b => I.bm[b]), tm), vn = lrr(ib.map(b => I.bn[b]), tn), dec = I.days > 1 ? 1 : 0;
                const tot2 = (name, icon, tot) => `<div class="ksh">${icon}<span>${name}</span><u>|</u><b>${tot}</b></div>`;
                const mcN = c => String((P.D.mcno || [])[c] ?? "").trim();
                const mcList = mp => { const a = [...mp].map(([c, n]) => [mcN(c), n]).filter(x => x[0]).sort((x, y) => nat(x[0], y[0])).map(([nm, n]) => I.days > 1 ? nm + " (" + n + "d)" : nm); return a.length ? (a.length > 12 ? a.slice(0, 12).join(", ") + " +" + (a.length - 12) + " more" : a.join(", ")) : "—" };
                const tipOf = bi => esc((R.bayD[bi] || "All") + (I.days > 1 ? " · idle machines (days)" : " · idle machines") + "\n☀ Morning: " + mcList(I.mmB[bi]) + "\n☾ Night: " + mcList(I.mnB[bi]));
                const rows = ib.map((bi, k) => (I.bm[bi] + I.bn[bi] > 0) ? `<span data-tip="${tipOf(bi)}"><span>${dot(bays.includes(bi) ? bays.indexOf(bi) : k)}${esc(R.bayD[bi] || "All")}</span><u>|</u><em class="kmn">M <b>${vm[k]}</b> · N <b>${vn[k]}</b></em></span>` : "").join("") || '<span class="kno"><span>No idle machine</span></span>';
                const CAL = '<svg class="kcal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>';
                idleHTML = `<div class="kc k4"><div class="kt"><div class="kic">${ic("idle")}</div><div class="kn">Idle Machine</div></div><div class="kv2" data-tip="${I.t.toFixed(1)}${I.days > 1 ? " machines / day (avg)" : " machines (day total)"}">${tm + tn}</div><div class="ksub"><span class="kdt">${CAL}${I.days > 1 ? "Daily avg · " + I.days + " days" : "Day total"}</span>${lyChip(I.t, L ? L.t : 0, R.lyOk, true)}</div>${dv}<div class="ksh2">${tot2("Morning", SUNW, tm)}${tot2("Night", MOONW, tn)}</div><div class="kbay kbay2">${rows}</div><div class="klg"><b>M</b> = Morning <i></i> <b>N</b> = Night</div></div>`
            }
            h += idleHTML;
            return h
        }
        {
            const ct = document.createElement("div"); ct.id = "ctip"; document.body.appendChild(ct);
            const CC = [["Bar", /bar/i], ["Hanger", /hanger/i], ["Sizer", /sizer/i], ["Clip", /clip/i], ["Accessories", /access/i]];
            const fx = v => { const a = Math.abs(v); return a >= 1e9 ? (v / 1e9).toFixed(2) + "B" : a >= 1e6 ? (v / 1e6).toFixed(2) + "M" : a >= 1e3 ? Math.round(v / 1e3) + "K" : String(Math.round(v)) };
            const bayN = s => { const m = String(s).match(/^bay\s*-?\s*0*(\d+)$/i); return m ? "Bay-" + String(m[1]).padStart(2, "0") : (String(s) || "All") };
            function ctHTML(el) {
                const R = LASTR; if (!R) return "";
                const d = +el.dataset.d, t = el.dataset.t, hol = el.classList.contains("hd");
                if (hol || d < 0) return `<div class="th"><b>${esc(t)}</b><span class="hol">Holiday · No production</span></div>`;
                const colOf = R.catD.map(n => CC.findIndex(c => c[1].test(String(n))));
                const rows = []; let gt = 0; const gc = CC.map(() => 0);
                for (let bi = 0; bi < R.nb; bi++) {
                    const cs = CC.map(() => 0); let tot = 0;
                    for (let ci = 0; ci < R.ncat; ci++) {
                        const v = R.dbc[(d * R.nb + bi) * R.ncat + ci]; if (!v) continue;
                        tot += v; if (colOf[ci] >= 0) cs[colOf[ci]] += v
                    }
                    if (tot > 0) { rows.push({ n: R.bayD[bi], cs, tot }); cs.forEach((v, k) => gc[k] += v); gt += tot }
                }
                rows.sort((a, b) => nat(a.n, b.n));
                const cell = v => v > 0 ? `<td>${fx(v)}</td>` : `<td class="z">-</td>`;
                const body = rows.map(r => `<tr><td>${esc(bayN(r.n))}</td>${r.cs.map(cell).join("")}<td><b>${fx(r.tot)}</b></td><td>${(r.tot / gt * 100).toFixed(1)}%</td></tr>`).join("");
                return `<div class="th"><b>${fx(gt)}</b><span>${esc(t)} · Total Production</span></div>
<table><thead><tr><th>Bay Name</th>${CC.map(c => `<th>${c[0]}</th>`).join("")}<th>Total</th><th>%</th></tr></thead><tbody>${body}
<tr class="tt"><td>Total</td>${gc.map(cell).join("")}<td>${fx(gt)}</td><td>100%</td></tr></tbody></table>`
            }
            let last = null;
            document.addEventListener("mousemove", e => {
                const el = e.target.closest && e.target.closest(".pcd[data-d]");
                if (!el) { ct.style.display = "none"; last = null; return }
                if (el !== last) { ct.innerHTML = ctHTML(el); last = el }
                ct.style.display = "block";
                ct.style.left = Math.max(6, Math.min(e.clientX + 14, innerWidth - ct.offsetWidth - 8)) + "px";
                ct.style.top = Math.max(6, Math.min(e.clientY + 16, innerHeight - ct.offsetHeight - 8)) + "px"
            })
        }
        let LASTR = null;
        function renderCards() {
            if (!P || !$("#cards")) return; LASTR = compute(); if ($("#kcs")) $("#kcs").innerHTML = kpiHTML(LASTR); drawCards()
        }
        function drawCards() {
            const R = LASTR; if (!R) return;
            $("#cards").innerHTML = monthCard(R) + yearCard(R) + shiftCard(R) + catCard(R) + heatCard(R) + achCard(R) + calCard(R);
            document.querySelectorAll("#cards .tg button").forEach(b => b.onclick = () => { ST[b.dataset.c] = b.dataset.m; drawCards() });
            document.querySelectorAll("#cards .achs").forEach(s => s.onchange = () => { ST.am = s.value; drawCards() });
            document.querySelectorAll("#cards .achv button").forEach(b => b.onclick = () => { ST.acv = b.dataset.m; drawCards() })
        }

        /* ---------- page switching ---------- */
        let CUR = "";
        const msg = (t, d) => `<div class="empty"><b>${t}</b>${d}</div>`;
        async function showProd() {
            const c = $("#pgc");
            if (!SUB) { c.innerHTML = msg("Production-Shopfloor data source not found", "Create the “Production-Shopfloor” sub-module under Production &amp; Planning in Admin Console."); return }
            if (!PK) c.innerHTML = `<div class="ld">Loading data…</div>`;
            await loadPK(); if (CUR !== "prod") return;
            if (!PK) { c.innerHTML = PKERR === "err" ? msg("Could not load data", "Check your connection or your access to Production-Shopfloor, then reload.") : msg("No data connected yet", "Upload the Production Excel in Admin Console → Data Manager → Production &amp; Planning → Production-Shopfloor."); return }
            c.innerHTML = filterBarHTML() + `<div class="kcs" id="kcs"></div><div class="cards" id="cards"></div>`; bindFilters(); renderCards()
        }
        function show(p) {
            CUR = p; closePop();
            document.querySelectorAll(".nv[data-p]").forEach(n => n.classList.toggle("on", n.dataset.p === p));
            $("#pt").textContent = PG[p][0]; $("#ps").textContent = PG[p][1];
            if (p === "prod") showProd();
            else $("#pgc").innerHTML = `<div class="empty"><b>${PG[p][0]}</b>No data connected yet. This page will fill in once its Excel source is added in Admin Console → Data Manager.</div>`;
            location.hash = p
        }
        (async () => {
            const ME = await ERP.require(); if (!ME) return;
            const nm = ME.name || ME.login_id; $("#un").textContent = nm; $("#av").textContent = nm.slice(0, 2).toUpperCase();
            const hr = new Date().getHours(); $("#gr").textContent = `Good ${hr < 12 ? "morning" : hr < 17 ? "afternoon" : "evening"}, ${nm.split(" ")[0]}. Here is your operation at a glance.`;
            if (ME.role === "admin") $("#adm").style.display = "block";
            $("#ub").onclick = e => { e.stopPropagation(); const m = $("#mn"); m.style.display = m.style.display === "block" ? "none" : "block" }; document.onclick = () => $("#mn").style.display = "none";
            const mods = await ERP.tree(), M = mods.find(x => /production/i.test(String(x.name)));
            if (!M || !(ERP.can(ME, M.id) || M.subs.some(s => ERP.can(ME, s.id, "v", M.id)))) { location.replace("portal.html"); return }
            SUB = M.subs.find(s => ERP.packKey(s.name) === "shopfloor") || null;
            ERP.sideBanner([M.id, ...M.subs.map(s => s.id)], SUB ? [[SUB.id, "shopfloor"]] : []);
            const h = location.hash.slice(1); show(PG[h] ? h : "oee")
        })().catch(e => console.error(e));
    </script>
</body>
